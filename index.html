oblar boʻyicha olinadigan mablagʻlar” hisobvaragʻi orqali)."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","86. Banklarga Markaziy bankning bosh boshqarmalari HKKMlaridan topshirilgan naqd pullar uchun tasdiqnoma kelib tushganda, quyidagi buxgalteriya oʻtkazmasini amalga oshirishlari shart:",["Dt 10311 “Markaziy bankdan olinishi lozim boʻlgan mablagʻlar — Topshirilgan naqd pullar”;","Kt 10109 “Yoʻldagi naqd pullar va boshqa toʻlov hujjatlari”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","87. Bankka topshirilgan naqd pullar uchun Markaziy bankning bosh boshqarmalari HKKMlaridan mablagʻ kelib tushganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 21314 “Rezident banklari tomonidan topshirilgan naqd pul uchun toʻlanishi lozim boʻlgan mablagʻlar” (Markaziy bankda) (16103 “Bosh ofis/filiallardan filiallar va banklararo hisob-kitoblar boʻyicha olinadigan mablagʻlar” hisobvaragʻi);","Kt 10311 “Markaziy bankdan olinishi lozim boʻlgan mablagʻlar — Topshirilgan naqd pullar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","88. Qimmatli qogʻozlar chiqarilishi davlat roʻyxatidan oʻtkazilganidan keyin qimmatli qogʻozlarni chiqarish toʻgʻrisidagi qarorning emitent bankka berilgan nusxasiga asosan quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","89. Aksiyalar uchun obuna qilinganda va aksiya oldi-sotdi shartnomasi tuzilganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["1) imtiyozli aksiyalar boʻyicha:","Dt 30303 “Aksiyalar uchun obuna boʻyicha olinishi lozim boʻlgan mablagʻlar — Imtiyozli (kontr-passiv)”;","Kt 30309 “Roʻyxatdan oʻtkazilgan ustav kapitali — Imtiyozli”;","2) oddiy aksiyalar boʻyicha:","Dt 30306 “Aksiyalar uchun obuna boʻyicha olinishi lozim boʻlgan mablagʻlar — Oddiy (kontr-passiv)”;","Kt 30312 “Roʻyxatdan oʻtkazilgan ustav kapitali — Oddiy”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","90. Aksiya uchun toʻlov toʻliq yoki qisman olinganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi;","Kt 30303 “Aksiyalar uchun obuna boʻyicha olinishi lozim boʻlgan mablagʻlar — Imtiyozli (kontr-passiv)” yoki 30306 “Aksiyalar uchun obuna boʻyicha olinishi lozim boʻlgan mablagʻlar — Oddiy (kontr-passiv)”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","91. Toʻlov toʻliq olingandan soʻng bitim amalga oshirilganda, aksiya boʻyicha egalik huquqi oʻtkazilganligini tasdiqlovchi depo hisobvaragʻidan olingan tegishli koʻchirmaga asosan bir vaqtning oʻzida quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) imtiyozli aksiyaning nominal qiymati boʻyicha:","Dt 30309 “Roʻyxatdan oʻtkazilgan ustav kapitali — Imtiyozli”;","Kt 30315 “Chiqarilgan ustav kapitali — Imtiyozli”;","2) oddiy aksiyaning nominal qiymati boʻyicha:","Dt 30312 “Roʻyxatdan oʻtkazilgan ustav kapitali — Oddiy”;","Kt 30318 “Chiqarilgan ustav kapitali — Oddiy”;","3) obuna bahosi va nominal qiymat oʻrtasidagi ijobiy farq summasi boʻyicha:","Dt 30309 “Roʻyxatdan oʻtkazilgan ustav kapitali — Imtiyozli” yoki","Dt 30312 “Roʻyxatdan oʻtkazilgan ustav kapitali — Oddiy”;","Kt 30603 “Qoʻshilgan kapital — Imtiyozli”;","4) joylashtirilgan aksiyalar boʻyicha:","Dt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Kt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","92. Aksiyalarning chiqarilishi bilan bogʻliq boʻlgan xarajatlar 56795 “Boshqa operatsion xarajatlar” hisobvaragʻining “Aksiyalarni chiqarish bilan bogʻliq xarajatlar” alohida shaxsiy hisobvaragʻida hisobga olinadi.",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","93. Agar aksiyalar chiqarilishidan avval aksiyaning qiymati potensial aksiyadorlar tomonidan toʻliq yoki qisman toʻlanganda, aksiyalar boʻyicha oldindan toʻlovlar aksiyalar chiqarilishiga qadar majburiyatlarda aks ettiriladi. Shuningdek, bankning yangi aksiyalariga obunada ishtirok etish kafolati uchun potensial aksiyadorlar tomonidan omonat (depozit) qoʻyilishi mumkin.",["Bunda, quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:","1) oldindan toʻlov amalga oshirilganda:","Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi;","Kt 29830 “Aksiyalar uchun obuna mablagʻini toʻlash boʻyicha depozitlar”;","2) aksiyalar sotilganda, aksiya boʻyicha egalik huquqi oʻtkazilganligini tasdiqlovchi depo hisobvaragʻidan olingan tegishli koʻchirmaga asosan:","Dt 29830 “Aksiyalar uchun obuna mablagʻini toʻlash boʻyicha depozitlar” — toʻlov summasiga;","Kt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” yoki","Kt 30318 “Chiqarilgan ustav kapitali — Oddiy” — aksiyaning nominal qiymatiga;","Kt 30603 “Qoʻshilgan kapital — Imtiyozli” — toʻlov summasi bilan nominal qiymati oʻrtasidagi ijobiy farq summasiga."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","94. Eʼlon qilingan dividendlarning hisoblanishi va toʻlanishi quyidagi buxgalteriya oʻtkazmalari orqali amalga oshiriladi:",["1) dividendlar hisoblanganda:","Dt 31203 “Taqsimlanmagan foyda (aktiv-passiv)” (yillik dividendlarni hisoblashda);","Dt 31206 “Sof foyda (zarar) (aktiv-passiv)” (oraliq dividendlarni hisoblashda);","Dt 30903 “Umumiy zaxira fondi” (foyda yetmaganda imtiyozli aksiyalar boʻyicha);","Kt 29822 “Toʻlanishi lozim boʻlgan dividendlar”;","2) dividendlar toʻlanganda:","Dt 29822 “Toʻlanishi lozim boʻlgan dividendlar”;","Kt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi;","3) hisoblangan dividendlar bank ustav kapitalini oshirishga yoʻnaltirilganda:","Dt 29822 “Toʻlanishi lozim boʻlgan dividendlar”;","Kt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” yoki","Kt 30318 “Chiqarilgan ustav kapitali — Oddiy” — aksiyaning nominal qiymatiga;","Kt 30603 “Qoʻshilgan kapital — Imtiyozli” — nominal qiymatidan yuqori summasiga.","Bir vaqtning oʻzida ushbu Qoidalarning 92-bandi “g” kichik bandida koʻrsatilgan buxgalteriya oʻtkazmasi amalga oshiriladi."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","95. Aksiyalarning nominal qiymatini oshirish hisobiga ustav kapitali koʻpaytirilganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 30603 “Qoʻshilgan kapital — Imtiyozli” yoki","Dt 31203 “Taqsimlanmagan foyda (aktiv-passiv)” yoxud","Dt 31206 “Sof foyda (zarar) (aktiv-passiv)” (30603 Qoʻshilgan kapital — Imtiyozli hisobvaragʻida mablagʻ yetmaganda);","Kt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” yoki","Kt 30318 “Chiqarilgan ustav kapitali — Oddiy”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","96. Taqsimlanmagan foydani kapitallashtirish hisobiga qoʻshimcha aksiyalar joylashtirilganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 31203 “Taqsimlanmagan foyda (aktiv-passiv)”;","Kt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” yoki","Kt 30318 “Chiqarilgan ustav kapitali — Oddiy” — aksiyaning nominal qiymatiga;","Kt 30603 “Qoʻshilgan kapital — Imtiyozli” — aksiyaning nominal qiymatidan yuqori summasiga."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","97. Ilgari chiqarilgan qimmatli qogʻozlarga erkin ayirboshlash hisobiga bank aksiyalari joylashtirilganda quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) imtiyozli aksiyalarni oddiy aksiyalarga yoki imtiyozli aksiyalarni boshqa turdagi imtiyozli aksiyalarga ayirboshlanganda:","Dt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” — aksiyaning nominal qiymatiga;","Kt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” yoki","Kt 30318 “Chiqarilgan ustav kapitali — Oddiy” — aksiyaning nominal qiymatiga;","2) erkin ayirboshlanadigan obligatsiyalar ayirboshlash uchun taqdim etilganda:","Dt 23602 “Chiqarilgan obligatsiyalar” balans hisobvaragʻining “Erkin ayirboshlanadigan obligatsiyalar” shaxsiy hisobvaragʻida — erkin ayirboshlashga taqdim etilgan qimmatli qogʻoz qiymatiga;","Kt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” yoki","Kt 30318 “Chiqarilgan ustav kapitali — Oddiy” — aksiyaning nominal qiymatiga;","Kt 30603 “Qoʻshilgan kapital — Imtiyozli” — nominal qiymatidan yuqori summasiga, ayirboshlash koeffitsiyenti 1 dan yuqori boʻlganda."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","98. Agar bank oʻz aksiyalarini ularni qayta sotish yoki bekor qilish maqsadida sotib olsa, u holda bankning oʻz kapitali aksiyani sotib olish qiymatiga kamayadi. Bunda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 30321 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Imtiyozli (kontr-passiv)” yoki","Dt 30324 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Oddiy (kontr-passiv)”;","Kt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","99. Agar bank oʻz aksiyalarini bekor qilish maqsadida sotib olsa, u holda aksiyalar 90329 “Bankning hujjatsiz qimmatli qogʻozlari” hisobvaragʻiga 1 soʻm shartli bahoda quyidagi buxgalteriya oʻtkazmasi orqali kirim qilinadi:",["Dt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","100. Agar bank oʻz aksiyalarini keyinchalik qayta sotish maqsadida sotib olsa, u holda aksiyalar 90337 “Bankning sotib olingan qimmatli qogʻozlari” hisobvaragʻiga nominal qiymatida quyidagi buxgalteriya oʻtkazmasi orqali kirim qilinadi:",["Dt 90337 “Bankning sotib olingan qimmatli qogʻozlari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","101. Bankning sotib olingan oʻz aksiyalari keyinchalik ikkilamchi bozorda qayta sotilganda, quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) sotib olish bahosiga nisbatan qimmat bahoda sotilganda:","Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi — aksiyani sotish qiymatiga;","Kt 30321 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Imtiyozli (kontr-passiv)” yoki","Kt 30324 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Oddiy (kontr-passiv)” — aksiyani sotib olish qiymatiga yoxud","Kt 30603 “Qoʻshilgan kapital — Imtiyozli” balans hisobvaragʻining “Qayta sotib olingan oʻz aksiyalari boʻyicha qoʻshilgan kapital” shaxsiy hisobvaragʻi — qayta sotish va sotib olish oʻrtasidagi ijobiy farq summasiga;","2) sotib olish bahosiga nisbatan arzon bahoda sotilganda:","Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi — aksiyani sotish qiymatiga;","Dt 30603 “Qoʻshilgan kapital — Imtiyozli” — aksiyani qayta sotish va sotib olish oʻrtasidagi salbiy farq summasiga, kredit qoldigʻi doirasida;","Kt 30321 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Imtiyozli (kontr-passiv)” yoki","Kt 30324 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Oddiy (kontr-passiv)” — aksiyani sotib olish qiymatiga.","30603 “Qoʻshilgan kapital — Imtiyozli” hisobvaragʻining “Oʻz aksiyalarini sotib olishdan olingan qoʻshilgan kapital” alohida shaxsiy hisobvaragʻining qoldigʻi nolga teng boʻlsa, aksiyani qayta sotish va sotib olish oʻrtasidagi salbiy farq 31206 “Sof foyda (zarar) (aktiv-passiv)” balans…","3) bir vaqtning oʻzida quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Kt 90337 “Bankning sotib olingan qimmatli qogʻozlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","102. Aksiyalar bekor qilinganda yoki bankning aksiyadorlik kapitali kamaytirilganda (ustav hujjatlariga kiritiladigan tegishli oʻzgartirishlar Markaziy bankda roʻyxatga olingandan soʻng), quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 30315 “Chiqarilgan ustav kapitali — Imtiyozli” yoki","Dt 30318 “Chiqarilgan ustav kapitali — Oddiy” — aksiyaning nominal qiymatiga;","Kt 30321 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Imtiyozli (kontr-passiv)” yoki","Kt 30324 “Aksiyadorlardan qayta sotib olingan oʻz aksiyalari — Oddiy (kontr-passiv)” — aksiyani sotib olish qiymatiga."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","103. Bankning oʻz aksiyalarini sotib olish bilan ularning nominal qiymati oʻrtasidagi ijobiy yoki salbiy farq 30603 “Qoʻshilgan kapital — Imtiyozli” balans hisobvaragʻining mos ravishda debeti yoki kreditida hisobga olinadi. Hisobvaraqning kredit qoldigʻi yetarli boʻlmaganda, yetmagan salbiy farq 31206 “Sof foyda (zarar) (aktiv-passiv)” balans hisobvaragʻiga olinadi.",["Bir vaqtning oʻzida quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Kt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","104. Hujjatsiz yoki hujjatli qimmatli qogʻozlarning blankalari Markaziy depozitariyda hisobga olinganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 90327 “Bankning qimmatli qogʻozlari blankalari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Dt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”"]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","105. Qimmatli qogʻozlar nominal qiymati boʻyicha joylashtirilganda, quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi;","Kt 23600 “Bank tomonidan chiqarilgan qimmatli qogʻozlar”;","Dt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Kt 90327 “Bankning qimmatli qogʻozlari blankalari”;","Dt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Kt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","106. Qimmatli qogʻoz nominal qiymatidan yuqori bahoda sotilganda sotish bahosi va nominal qiymat oʻrtasidagi farq (mukofot) 23696 “Chiqarilgan qimmatli qogʻozlar boʻyicha mukofot” hisobvaragʻining kreditiga sotish kunida quyidagi buxgalteriya oʻtkazmasi orqali oʻtkaziladi:",["Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi — qimmatli qogʻozni sotish qiymatiga;","Kt 23600 “Bank tomonidan chiqarilgan qimmatli qogʻozlar” — qimmatli qogʻozning nominal qiymatiga;","Kt 23696 “Chiqarilgan qimmatli qogʻozlar boʻyicha mukofot” — qimmatli qogʻozni sotish qiymati va nominal qiymati oʻrtasidagi farq summasiga.","Bir vaqtning oʻzida qimmatli qogʻoz blankasiga qimmatli qogʻozni oluvchi haqidagi tegishli yozuvlar kiritilganda yoki qimmatli qogʻozlar investorning depo hisobvaragʻiga oʻtkazilganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Kt 90327 “Bankning qimmatli qogʻozlari blankalari”;","Dt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Kt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","107. Qimmatli qogʻoz nominal qiymatidan past bahoda sotilsa, nominal qiymati va sotish bahosi oʻrtasidagi farq (diskont) 23698 “Chiqarilgan qimmatli qogʻozlar boʻyicha diskont (kontr-passiv)” balans hisobvaragʻining debetiga sotish sanasida quyidagi buxgalteriya oʻtkazmasi orqali oʻtkaziladi:",["Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi — qimmatli qogʻozni sotish qiymatiga;","Dt 23698 “Chiqarilgan qimmatli qogʻozlar boʻyicha diskont (kontr-passiv)” — qimmatli qogʻozning nominal qiymati va sotish qiymati oʻrtasidagi farq summasiga;","Kt 23600 “Bank tomonidan chiqarilgan qimmatli qogʻozlar” — qimmatli qogʻozning nominal qiymatiga.","Diskontlar balans hisobotida chiqarilgan qimmatli qogʻozlarning umumiy summasidan chegirma koʻrinishida aks ettiriladi."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","108. Agar qimmatli qogʻozlar foizlarni toʻlash davrlari orasida sotilgan boʻlsa, sotilgan va toʻlanishi lozim boʻlgan foizli majburiyatlar quyidagi buxgalteriya oʻtkazmasi orqali sotish sanasida hisobga olinadi:",["Dt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi;","Kt 22414 “Chiqarilgan qimmatli qogʻozlar boʻyicha toʻlanishi lozim boʻlgan hisoblangan foizlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","109. Qimmatli qogʻozlar soʻndirish yoki qayta sotish shartlari bilan sotib olinganda, balansdan hisobdan chiqariladi. Agar sotib olish balans qiymatida boʻlsa, quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) ilgari nominal qiymatda sotilgan qimmatli qogʻozlar sotib olinganda:","Dt 23600 “Bank tomonidan chiqarilgan qimmatli qogʻozlar” — nominal qiymatga;","Kt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi — nominal qiymatga;","2) ilgari diskont bilan sotilgan qimmatli qogʻozlar sotib olinganda:","Dt 23600 “Bank tomonidan chiqarilgan qimmatli qogʻozlar” — nominal qiymatga;","Kt 23698 “Chiqarilgan qimmatli qogʻozlar boʻyicha diskont (kontr-passiv)” — diskontning qoldiq qiymati doirasida;","Kt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi — qimmatli qogʻozni sotib olish qiymatiga;","3) ilgari mukofot bilan sotilgan qimmatli qogʻozlar sotib olinganda:","Dt 23600 “Bank tomonidan chiqarilgan qimmatli qogʻozlar” — nominal qiymatga;","Dt 23696 “Chiqarilgan qimmatli qogʻozlar boʻyicha mukofot” — mukofotning qoldiq qiymati doirasida;","Kt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi — qimmatli qogʻozni sotib olish qiymatiga;","4) hisoblangan foizlarni toʻlashda:","Dt 22414 “Chiqarilgan qimmatli qogʻozlar boʻyicha toʻlanishi lozim boʻlgan hisoblangan foizlar”;","Kt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","110. Agar bank qimmatli qogʻozni nominal qiymatidan past bahoda sotib olsa, nominal qiymat va sotib olish bahosi oʻrtasida ijobiy farq 45994 “Boshqa foizsiz daromadlar” balans hisobvaragʻining “Chiqarilgan qarz majburiyatlari bilan bogʻliq operatsiyalardan olingan daromadlar” alohida shaxsiy hisobvaragʻining kreditida aks ettiriladi. Agar bank tomonidan qimmatli qogʻoz balans qiymatidan yuqori bahoda sotib olinsa, balans…",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","111. Agar bank qimmatli qogʻozni bekor qilish maqsadida sotib olgan boʻlsa, u holda qimmatli qogʻozlar 1 soʻm shartli bahoda quyidagi buxgalteriya oʻtkazmasi orqali hisobga olinadi:",["Dt 90327 “Bankning qimmatli qogʻozlari blankalari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”;","Dt 90329 “Bankning hujjatsiz qimmatli qogʻozlari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","112. Agar bank qimmatli qogʻozlarni qayta sotish maqsadida sotib olgan boʻlsa, u holda qimmatli qogʻozlar nominal qiymat boʻyicha quyidagi buxgalteriya oʻtkazmasi orqali kirim qilinadi:",["Dt 90337 “Bankning sotib olingan qimmatli qogʻozlari”;","Kt 96314 “Bankning qimmatli qogʻozlari boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","113. Mijozdan yoki bank-korrespondentdan mahalliy (ichki) yoki xorijiy (ichki) veksellar inkassoga qabul qilinganda, bank tomonidan vekselning nominal qiymatiga balansdan tashqari hisobvaraqlarida quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 90965 “Inkassoga qabul qilingan (ichki) veksellar — Mahalliy” yoki","Dt 90972 “Inkassoga qabul qilingan (ichki) veksellar — Xorijiy”;","Kt 96323 “Inkassoga qabul qilingan (ichki) veksellar boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","114. Veksel boʻyicha toʻlov toʻliq yoki qisman amalga oshirilganda yoki toʻlovsiz qaytarilganda (toʻlashdan bosh tortish yoki hisobvaragʻida mablagʻ yetishmaslik hollarida) quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 96323 “Inkassoga qabul qilingan (ichki) veksellar boʻyicha kontr-hisobvaraq”;","Kt 90965 “Inkassoga qabul qilingan (ichki) veksellar — Mahalliy” yoki","90972 “Inkassoga qabul qilingan (ichki) veksellar — Xorijiy”.","Veksel boʻyicha qisman toʻlov amalga oshirilganda vekselning toʻlanmagan summasi 90963 “Muddatida toʻlanmagan hisob-kitob hujjatlari” hisobvaragʻiga quyidagi buxgalteriya oʻtkazmasi orqali oʻtkaziladi:","Dt 90963 “Muddatida toʻlanmagan hisob-kitob hujjatlari”;","Kt 96321 “Muddatida toʻlanmagan hisob-kitob hujjatlari boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","115. Veksel boʻyicha bankda oʻz hisobvaragʻiga ega boʻlmagan toʻlovchilar yoki vakil-banklardan toʻlovni olish uchun veksellar inkassoga joʻnatilganda, ularning nominal qiymatiga quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 90979 “Inkassoga joʻnatilgan (tashqi) veksellar — Mahalliy” yoki","90986 “Inkassoga joʻnatilgan veksellar — xorijiy”;","Kt 96330 “Inkassoga joʻnatilgan (tashqi) veksellar boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","116. Veksel toʻlovchisi tomonidan veksel boʻyicha toʻlov amalga oshirilgandan soʻng quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 96330 “Inkassoga joʻnatilgan (tashqi) veksellar boʻyicha kontr-hisobvaraq”;","Kt 90979 “Inkassoga joʻnatilgan (tashqi) veksellar — Mahalliy” yoki","Kt 90986 — “Inkassoga joʻnatilgan veksellar — xorijiy”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","117. Banklar qimmatli qogʻozlar bilan bogʻliq inkasso operatsiyalaridan daromadlar va xarajatlar koʻrishi mumkin. Bu holda, daromadlar 45257 “Mijozlarga inkasso operatsiyalari boʻyicha koʻrsatilgan xizmatlar uchun olingan daromadlar” hisobvaragʻida va xarajatlar 55158 “Inkasso operatsiyalarini amalga oshirish boʻyicha va vositachilik xarajatlari” hisobvaraqlarida hisobga olinadi.",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","118. Qimmatli qogʻozlarni sotib olish uchun mijozlar tomonidan oʻtkazilgan pul mablagʻlari hamda vositachilik va topshiriq shartnomalari boʻyicha mijozlarning qimmatli qogʻozlarini sotishdan olingan pul mablagʻlarining hisobi 22608 “Mijozlarning qimmatli qogʻozlar bilan boʻladigan operatsiyalar boʻyicha mablagʻlari” balans hisobvaragʻining “Qimmatli qogʻozlar bilan brokerlik operatsiyalari boʻyicha mijozlar mablagʻlari”…",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","119. Sotish uchun yoki mijozning topshirigʻiga asosan sotib olingan qimmatli qogʻozlar 93616 “Davlatning shartli tarzda saqlanayotgan qimmatli qogʻozlari” va 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari” balansdan tashqari hisobvaraqlarida nominal qiymat boʻyicha hisobga olinadi:",["Dt 93616 “Davlatning shartli tarzda saqlanayotgan qimmatli qogʻozlari” yoki","Dt 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari”;","Kt 96379 “Saqlanayotgan qimmatli qogʻozlar va boshqa qimmatbaho buyumlar boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","120. Mijozlarning topshirigʻiga koʻra sotish uchun olingan qimmatli qogʻozlar sotilmaganda, ular mijozlarga qaytarilganda, shuningdek mijozlarga ularning topshirigʻi boʻyicha sotib olingan qimmatli qogʻozlarni topshirishda qimmatli qogʻozlarning nominal qiymatiga quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 96379 “Saqlanayotgan qimmatli qogʻozlar va boshqa qimmatbaho buyumlar boʻyicha kontr-hisobvaraq”;","Kt 93616 “Davlatning shartli tarzda saqlanayotgan qimmatli qogʻozlari” yoki","Kt 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","121. Banklar tomonidan vositachilik operatsiyalarini bajarishdan olingan daromadlar 45209 “Qimmatli qogʻozlar bilan amalga oshirilgan investitsiyaviy vositachilik operatsiyalari boʻyicha daromadlar” balans hisobvaragʻining kreditida hisobga olinadi.",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","122. Qimmatli qogʻozlar emitentdan joylashtirish uchun olinganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 93616 “Davlatning shartli tarzda saqlanayotgan qimmatli qogʻozlari” yoki","Dt 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari”;","Kt 96379 “Saqlanayotgan qimmatli qogʻozlar va boshqa qimmatbaho buyumlar boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","123. Emitentning qimmatli qogʻozlarini joylashtirishdan olingan pul mablagʻlarining hisobi 22608 “Mijozlarning qimmatli qogʻozlar bilan boʻladigan operatsiyalar boʻyicha mablagʻlari” balans hisobvaragʻining “Qimmatli qogʻozlarning chiqarilishiga xizmat koʻrsatish bilan bogʻliq emitentlar mablagʻlari” alohida shaxsiy hisobvaragʻida hisobga olinadi.",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","124. Qimmatli qogʻozlarni ularning birinchi egalariga joylashtirishda, shuningdek joylashtirilmagan qimmatli qogʻozlarni emitentga qaytarishda qimmatli qogʻozlarning nominal qiymati boʻyicha quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 96379 “Saqlanayotgan qimmatli qogʻozlar va boshqa qimmatbaho buyumlar boʻyicha kontr-hisobvaraq”;","Kt 93616 “Davlatning shartli tarzda saqlanayotgan qimmatli qogʻozlari” yoki","Kt 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","125. Bank qimmatli qogʻozlarni emitentning topshirigʻiga asosan emitentning mablagʻlari hisobiga soʻndiradi. Emitentdan olingan mablagʻlar 22608 “Mijozlarning qimmatli qogʻozlar bilan boʻladigan operatsiyalar boʻyicha mablagʻlari” balans hisobvaragʻining “Qimmatli qogʻozlarni chiqarish boʻyicha emitentlarning mablagʻlari” alohida shaxsiy hisobvaragʻida hisobga olinadi. Emitentning qimmatli qogʻozlari soʻndirilganda,…",["Dt 22608 “Mijozlarning qimmatli qogʻozlar bilan boʻladigan operatsiyalar boʻyicha mablagʻlari”;","Kt Kassa hisobvaragʻi yoki bankning vakillik hisobvaragʻi yoxud mijozning hisobvaragʻi.","Bir vaqtning oʻzida soʻndirilgan qimmatli qogʻozlarning blankalari balansdan tashqari hisobvaraqlariga 1 soʻm shartli bahoda quyidagi buxgalteriya oʻtkazmalari orqali kirim qilinadi:","Dt 90303 “Davlatning qimmatli qogʻozlari blankalari”;","Kt 96305 “Davlatning qimmatli qogʻozlari blankalari boʻyicha kontr-hisobvaraq” yoki","Dt 90317 “Boshqa tashkilot va muassasalarning qimmatli qogʻozlari blankalari”;","Kt 96315 “Boshqa tashkilot va muassasalarning qimmatli qogʻozlari blankalari boʻyicha kontr-hisobvaraq”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","126. Emitentning topshirigʻiga koʻra soʻndirilgan qimmatli qogʻozlarning blankalarini emitentga oʻtkazishda yoki bekor qilishda 1 soʻm shartli bahoda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 96305 “Davlatning qimmatli qogʻozlari blankalari boʻyicha kontr-hisobvaraq”;","Kt 90303 “Davlatning qimmatli qogʻozlari blankalari” yoki","Dt 96315 “Boshqa tashkilot va muassasalarning qimmatli qogʻozlari blankalari boʻyicha kontr-hisobvaraq”;","Kt 90317 “Boshqa tashkilot va muassasalarning qimmatli qogʻozlari blankalari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","127. Anderrayting xizmatlarini amalga oshirishdan olingan daromadlar 45294 “Boshqa koʻrsatilgan xizmatlar va vositachilik uchun olingan daromadlar” hisobvaragʻining “Qimmatli qogʻozlarning chiqarilishiga xizmat koʻrsatish boʻyicha bank operatsiyalaridan olingan daromadlar” alohida shaxsiy hisobvaragʻida hisobga olinadi.",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","128. Mijozlardan qimmatli qogʻozlar saqlash uchun qabul qilinganda nominal qiymati boʻyicha quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 93616 “Davlatning shartli tarzda saqlanayotgan qimmatli qogʻozlari” yoki","Dt 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari”;","Dt 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari”;"]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","129. Qimmatli qogʻozlar saqlashdan chiqarilib mijozga qaytarilganda, nominal qiymat boʻyicha quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 96379 “Saqlanayotgan qimmatli qogʻozlar va boshqa qimmatbaho buyumlar boʻyicha kontr-hisobvaraq”;","Kt 93616 “Davlatning shartli tarzda saqlanayotgan qimmatli qogʻozlari” yoki","Kt 93623 “Shartli tarzda saqlanayotgan xususiy qimmatli qogʻozlar/tijorat hujjatlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","130. Saqlash operatsiyalarini amalga oshirishdan olingan daromadlar 45294 “Boshqa koʻrsatilgan xizmatlar va vositachilik uchun olingan daromadlar” balans hisobvaragʻining “Bankning qimmatli qogʻozlarni saqlash boʻyicha bajargan operatsiyalaridan olingan daromadlar” alohida shaxsiy hisobvaragʻining kreditida hisobga olinadi.",[]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","131. REPO bitimlari boʻyicha sotilgan qimmatli qogʻozlar 22300 “REPO bitimlari boʻyicha sotilgan qimmatli qogʻozlar” balans hisobvaragʻining tegishli hisobvaragʻida hisobga olinadi. Qayta sotib olish sharti bilan qimmatli qogʻozlarning oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning birinchi qismini bajarishda qimmatli qogʻozlarni sotuvchi bank tomonidan bitimning birinchi qismi boʻyicha qimmatli qogʻozlarni sotish…",["Dt Bankning vakillik hisobvaragʻi yoki mijozning hisobvaragʻi;","Kt 22300 “REPO bitimlari boʻyicha sotilgan qimmatli qogʻozlar”.","Bir vaqtning oʻzida balansdan tashqari hisobvaraqlar boʻyicha:","Dt 92802 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar”;","Kt 96374 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar kontr-hisobvaragʻi”.","92802 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar” hisobvaragʻida qimmatli qogʻozlar REPO operatsiyasining birinchi qismiga muvofiq, qimmatli qogʻozlarning sotilish sanasidan boshlab, bank tomonidan REPO operatsiyasining ikkinchi qismiga muvofiq, qimmatli qogʻozlarni sotib olish…"]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","132. REPO operatsiyasining ikkinchi qismi boʻyicha qimmatli qogʻozlarni qayta sotib olish bahosi hamda REPO operatsiyasining birinchi qismi boʻyicha qimmatli qogʻozlarni sotish bahosi oʻrtasidagi farq oʻz mohiyatiga koʻra olingan pul mablagʻlari uchun toʻlov hisoblanadi. Koʻrsatilgan farq amortizatsiya qilinadi va sotuvchi bank tomonidan har oyda qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimi…",["Dt 54300 “Qimmatli qogʻozlar bilan amalga oshirilgan REPO bitimlari boʻyicha foizli xarajatlar”;","Kt 22300 “REPO bitimlari boʻyicha sotilgan qimmatli qogʻozlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","133. Agar REPO kelishuvning birinchi qismi boʻyicha REPO summasi foiz (kupon) daromadlari miqdorida kamayishi koʻzda tutilgan boʻlsa, u holda REPO summasi dastlabki sotib oluvchi tomonidan olingan foiz (kupon) daromadlari miqdorida kamayadi va quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 22300 “REPO bitimlari boʻyicha sotilgan qimmatli qogʻozlar”;","Kt REPO bitimining obyekti boʻlgan qimmatli qogʻozlar boʻyicha olinishi lozim boʻlgan foizlarning tegishli hisobvaragʻi."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","134. Qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarishda bank tomonidan kelishuvning ikkinchi qismi boʻyicha qayta sotib olingan qimmatli qogʻozlar summasiga quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 22300 “REPO bitimlari boʻyicha sotilgan qimmatli qogʻozlar”;","Kt Bankning vakillik hisobvaragʻi yoki mijozning hisobvaragʻi.","Bir vaqtning oʻzida balansdan tashqari hisobvaraqlarda kelishuvning ikkinchi qismi boʻyicha qayta sotib olingan qimmatli qogʻozlar qiymatida quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 96374 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar kontr-hisobvaragʻi”,","Kt 92802 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","135. Qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismi bajarilmagan hamda qimmatli qogʻozlar sotib oluvchi portfeliga oʻtkazilgan taqdirda, sotuvchi bank quyidagi buxgalteriya oʻtkazmasini amalga oshiradi:",["Dt 22300 “REPO bitimlari boʻyicha sotilgan qimmatli qogʻozlar” — bitimning ikkinchi qismi boʻyicha qimmatli qogʻozni qayta sotib olish summasiga;","Kt 10700 “Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar”, 10800 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar”, 15900 “Amortizatsiyalangan qiymati boʻyicha baholanadigan qarz qimmatli qogʻozlarga…","Kelishuvning ikkinchi qismi boʻyicha qimmatli qogʻozlarni sotib olish bahosi va uning balans qiymati oʻrtasidagi farq tegishli foyda yoki zarar hisobvaragʻida aks ettiriladi.","Bir vaqtning oʻzida balansdan tashqari hisobvaraqlarda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 96374 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar kontr-hisobvaragʻi”;","Kt 92802 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","136. Qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning birinchi qismini bajarishda, qimmatli qogʻozlarni sotib oluvchi bank kelishuvning ikkinchi qismi boʻyicha qimmatli qogʻozlarning sotib olish summasiga quyidagi buxgalteriya oʻtkazmasini bajaradi:",["Dt 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar”;","Kt Bankning vakillik hisobvaragʻi yoki mijozning hisobvaragʻi.","Bir vaqtning oʻzida bank tomonidan sotib olingan va qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarishda bank sotishi lozim boʻlgan qimmatli qogʻozlar qiymatiga balansdan tashqari hisobvaraqlarida quyidagi buxgalteriya…","Dt 92806 “Qimmatli qogʻozlarni sotish boʻyicha muddatli bitimlar”;","Kt 96376 “Qimmatli qogʻozlarni sotish boʻyicha muddatli bitimlar kontr-hisobvaragʻi”.","92806 “Qimmatli qogʻozlarni sotish boʻyicha muddatli bitimlar” hisobvaragʻida qimmatli qogʻozlar REPO operatsiyasining birinchi qismiga muvofiq qimmatli qogʻozlarni sotib olish sanasidan boshlab bank tomonidan REPO operatsiyasining ikkinchi qismiga muvofiq qimmatli qogʻozlarni sotish muddatigacha…"]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","137. Qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismi boʻyicha qimmatli qogʻozlarni qayta sotish bahosi va kelishuvning birinchi qismi boʻyicha qimmatli qogʻozlar sotib olish bahosi oʻrtasidagi farq oʻz mohiyatiga koʻra berilgan pul mablagʻlari uchun toʻlov hisoblanadi. Koʻrsatilgan farq amortizatsiya qilinadi va oluvchi bank tomonidan har oyda qayta sotib…",["Dt 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar”;","Kt 45000 “Qimmatli qogʻozlar bilan amalga oshirilgan REPO bitimlari boʻyicha foizli daromadlar”.","Banklar REPO bitimi boʻyicha kontragentning moliyaviy ahvoli yomonlashgan holda qimmatli qogʻozlarni qayta sotib olishi bankda shubha uygʻotsa, foizli daromad bank balansidan quyidagi buxgalteriya oʻtkazmasi bilan hisobdan chiqarilishi kerak:","Dt 45000 “Qimmatli qogʻozlar bilan amalga oshirilgan REPO bitimlari boʻyicha foizli daromadlar”;","Kt 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar”.","Hisobdan chiqarilgandan soʻng kelishuvning ikkinchi qismi boʻyicha qimmatli qogʻozlarni qayta sotish bahosi va kelishuvning birinchi qismi boʻyicha qimmatli qogʻozlarni sotib olish bahosi oʻrtasidagi farq amortizatsiyasi balansdan tashqari hisobvaraqlarda hisobga olinadi:","Dt 95411 “Olinishi lozim boʻlgan qimmatli qogʻozlar boʻyicha hisoblangan foizlar”;","Kt 96333 “Olinishi lozim boʻlgan qimmatli qogʻozlar boʻyicha hisoblangan foizlar kontr-hisobvaragʻi”.","Balansdan tashqari hisobvaraqda yuritiladigan hisob REPO kelishuvining ikkinchi qismi bajarilganidan soʻng toʻxtatiladi:","Dt 96333 “Olinishi lozim boʻlgan qimmatli qogʻozlar boʻyicha hisoblangan foizlar kontr-hisobvaragʻi”;","Kt 95411 “Olinishi lozim boʻlgan qimmatli qogʻozlar boʻyicha hisoblangan foizlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","138. Balans hisoboti sanasida kelishuvning birinchi qismi boʻyicha sotib olingan qimmatli qogʻozlarning bozor qiymati balans qiymati (11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar” hisobvaragʻida hisobga olingan summa) bilan tenglashtiriladi. Bozor qiymati balans qiymatidan tushib ketsa, bank xarajatlari hisobidan ehtimoliy yoʻqotishlar zaxirasi tashkil etiladi. Bunda, balans qiymati va bozor qiymati…",["Dt 56824 “Koʻrilishi mumkin boʻlgan zararlarni baholash — REPO bitimlari”;","Kt 11899 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar (kontr-aktiv)”.","Bozor qiymati balans qiymatidan oshib ketsa, zaxira nolga tenglashtiriladi:","Dt 11899 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar (kontr-aktiv)”;","Kt 56824 “Koʻrilishi mumkin boʻlgan zararlarni baholash — REPO bitimlari”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","139. Qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarishda bank quyidagi buxgalteriya oʻtkazmasini amalga oshiradi:",["Dt Bankning vakillik hisobvaragʻi yoki mijozning hisobvaragʻi;","Kt 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar” — bitimning ikkinchi qismi boʻyicha qimmatli qogʻozni qayta sotib olish summasiga.","Bir vaqtning oʻzida qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarishda bank tomonidan sotilgan qimmatli qogʻozlar qiymatiga balansdan tashqari hisobvaragʻi boʻyicha quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 96376 “Qimmatli qogʻozlarni sotish boʻyicha muddatli bitimlar kontr-hisobvaragʻi”;","Kt 92806 “Qimmatli qogʻozlarni sotish boʻyicha muddatli bitimlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","140. Bank qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarish sanasida 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar” hisobvaragʻida hisobga olingan qimmatli qogʻozlarning balans qiymati kelishuvning birinchi qismi boʻyicha qimmatli qogʻozlarni sotib olish summasiga teng boʻlishi lozim.",["Bu holatda kelishuvning ikkinchi qismi bajarilmagan va qimmatli qogʻozlar sotib oluvchi bank portfeliga oʻtkazilgan taqdirda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","1) qimmatli qogʻozlarning bozor qiymati kelishuvining birinchi qismi boʻyicha qimmatli qogʻozlarni sotib olish summasidan oshib ketsa:","a) ehtimoliy yoʻqotishlar zaxirasi miqdorini toʻgʻrilashga doir buxgalteriya oʻtkazmasi (zarur boʻlsa) amalga oshiriladi;","b) qimmatli qogʻozlarni bank portfeliga oʻtkazish boʻyicha buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 10700 “Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar” yoki","Dt 10800 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar” yoxud","Dt 15900 “Amortizatsiyalangan qiymati boʻyicha baholanadigan qarz qimmatli qogʻozlarga qilingan investitsiyalar”;","Kt 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar” — bitimning birinchi qismi boʻyicha qimmatli qogʻozni sotib olish summasiga.","2) qimmatli qogʻozning bozor qiymati kelishuvning birinchi qismi boʻyicha sotib olingan qiymatidan kam boʻlganda:","a) zaxira miqdorini oʻzgartirish boʻyicha buxgalteriya oʻtkazmasi (lozim boʻlganda) amalga oshiriladi;","b) qimmatli qogʻozlarni bank portfeliga oʻtkazish boʻyicha quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 10700 “Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar” yoki","Dt 10800 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar” yoxud","Dt 15900 “Amortizatsiyalangan qiymati boʻyicha baholanadigan qarz qimmatli qogʻozlarga qilingan investitsiyalar” — qimmatli qogʻozni bozor qiymatiga;"]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","141. Bank qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarish sanasida 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar” hisobvaragʻida hisobga olingan qimmatli qogʻozlarning balans qiymati kelishuvning ikkinchi qismi boʻyicha qimmatli qogʻozlar qayta sotuvi summasiga teng boʻlishi lozim.",["Kelishuvning ikkinchi qismi bajarilmagan holda bank foizli daromadlarni quyidagi buxgalteriya oʻtkazmasi orqali balansdan chiqarishi shart:","Dt 45000 “Qimmatli qogʻozlar bilan amalga oshirilgan REPO bitimlari boʻyicha foizli daromadlar”;","Kt 11800 “REPO bitimlari boʻyicha sotib olingan qimmatli qogʻozlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","142. Bank REPO bitimlarini qimmatli qogʻozlar oldi-sotdi operatsiyalari sifatida hisobga olishi mumkin:",["1) qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning birinchi qismini bajarishda qimmatli qogʻozlar sotuvchisi boʻlgan bank qimmatli qogʻozlarni sotish boʻyicha tegishli buxgalteriya oʻtkazmasini amalga oshiradi. Bunda sotilgan qimmatli qogʻozlar bank…","Bir vaqtning oʻzida bank tomonidan sotilgan va qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarishda bank sotib olishi lozim boʻlgan qimmatli qogʻozlar qiymatiga balansdan tashqari hisobvaragʻida quyidagi buxgalteriya…","Dt 92802 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar”;","Kt 96374 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar kontr-hisobvaragʻi”.","92802 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar” hisobvaragʻida qimmatli qogʻozlar REPO operatsiyasining birinchi qismiga muvofiq, qimmatli qogʻozlarni sotib olish sanasidan boshlab, bank tomonidan REPO operatsiyasining ikkinchi qismiga muvofiq, qimmatli qogʻozlarni sotish…","2) Qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarishda bank qimmatli qogʻozlarni sotib olish boʻyicha tegishli buxgalteriya oʻtkazmasini amalga oshiradi.","Bir vaqtning oʻzida qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarishda bank tomonidan sotib olingan qimmatli qogʻozlar qiymatiga balansdan tashqari hisobvaraq boʻyicha quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 96374 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar kontr-hisobvaragʻi”;","Kt 92802 “Qimmatli qogʻozlarni sotib olish boʻyicha muddatli bitimlar”."]],["7-bob. Qimmatli qogʻozlar bilan amalga oshiriladigan operatsiyalarning buxgalteriya hisobi","143. Qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning birinchi qismini bajarishda qimmatli qogʻozlar sotib oluvchisi boʻlgan bank qimmatli qogʻozlarni sotish boʻyicha tegishli buxgalteriya oʻtkazmasini amalga oshiradi.",["Bir vaqtning oʻzida bank tomonidan sotib olingan va qayta sotib olish sharti bilan qimmatli qogʻozlar oldi-sotdi bitimlari toʻgʻrisidagi kelishuvning ikkinchi qismini bajarish
