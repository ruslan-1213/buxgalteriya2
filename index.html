<title>Bank tizimi — amaliyot</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#d4d0c8;--fg:#000;--panel:#fff;--line:#808080;--head:#e6e6e6;--hi:#c5d8f0;--btn:#ece9e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2b2b;--fg:#eee;--panel:#1d1d1d;--line:#6a6a6a;--head:#383838;--hi:#2f4a6d;--btn:#3a3a3a}}
:root[data-theme="dark"]{--bg:#2b2b2b;--fg:#eee;--panel:#1d1d1d;--line:#6a6a6a;--head:#383838;--hi:#2f4a6d;--btn:#3a3a3a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 Tahoma,"Segoe UI",system-ui,sans-serif}
.win{border:1px solid var(--line);margin:6px;background:var(--bg)}
.title{padding:4px 8px;font-weight:bold;border-bottom:1px solid var(--line);background:var(--head);display:flex;justify-content:space-between;gap:8px}
.menu{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
.menu a{padding:5px 10px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.menu a.on{border:1px solid var(--line);background:var(--panel);font-weight:bold}
.tool{display:flex;flex-wrap:wrap;gap:4px;padding:5px;border-bottom:1px solid var(--line)}
button{font:inherit;padding:3px 10px;border:1px solid var(--line);background:var(--btn);color:var(--fg);border-radius:0;cursor:pointer}
button:active{background:var(--head)}
.pad{padding:6px}
.box{border:1px solid var(--line);background:var(--panel);padding:6px;margin:4px 0}
.lab{color:var(--line);font-size:11px}
.wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel);margin:4px 0}
table{border-collapse:collapse;width:100%;min-width:520px}
th{background:var(--head);border:1px solid var(--line);padding:3px 5px;text-align:left;font-weight:normal;white-space:nowrap}
td{border:1px solid var(--line);padding:0 5px}
tr.sel td{background:var(--hi)}
td input{width:100%;box-sizing:border-box;border:0;background:transparent;color:var(--fg);font:12px ui-monospace,Menlo,monospace;padding:4px 0;outline:0}
td input[type=checkbox]{width:auto;margin-right:6px}
input.f,textarea,select{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;padding:4px;margin:2px 0}
#sug a,.lnk{cursor:pointer;text-decoration:underline;color:var(--fg)}
details.pad{border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:bold}
.radio{display:flex;flex-wrap:wrap;gap:14px;padding:6px;border-top:1px solid var(--line)}
.stat{display:flex;flex-wrap:wrap;gap:12px;padding:3px 8px;border-top:1px solid var(--line);background:var(--head);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.docv{border:1px solid #000;padding:12px;background:#fff;color:#000;margin:6px 0}
.docv table{min-width:0}.docv th,.docv td{border-color:#000;color:#000;background:#fff;padding:3px 5px}
.sg{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px}
#pr{display:none}
@media print{.win{display:none}#pr{display:block}}
</style></head><body>

<div id="app"></div>

</div>

)ning hisobi olib boriladi.","Hisobvaraqning debetida boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qarz qimmatli qogʻozlarining xarid qilish bilan bogʻliq xarajatlari aks ettiriladi.","Hisobvaraqning kreditida boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qarz qimmatli qogʻozlarining xarid qilish bilan bogʻliq xarajatlar amortizatsiyasi hamda qarz qimmatli qogʻozlarini sotish, qayta tasniflash, birovga berish va/yoki boshqa yoʻl bilan hisobdan chiqarish vaqtida xarid qilish bilan bogʻliq…"],"10891":["boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qarz qimmatli qogʻozlarining xarid qiymati (sotib olish xarajatlari va agar mavjud boʻlsa sotib olingan foizlardan tashqari) bilan nominal qiymati oʻrtasidagi salbiy farq hisobi olib boriladi.","Hisobvaraqning debetida diskont amortizatsiyasi summasi hamda sotilgan, qayta tasniflangan, berilgan va/yoki boshqa yoʻl bilan hisobdan chiqarilayotgan qimmatli qogʻozlarning diskont summasi aks ettiriladi.","Hisobvaraqning kreditida qimmatli qogʻozlarning nominal qiymatidan past boʻlgan bahoda sotib olishdagi diskont summasi aks ettiriladi."],"10893":["boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qarz qimmatli qogʻozlarining xarid qiymati (sotib olish xarajatlari va agar mavjud boʻlsa, sotib olingan foizlardan tashqari) bilan nominal qiymati oʻrtasidagi ijobiy farq hisobi olib boriladi.","Hisobvaraqning debetida nominal qiymatidan yuqori boʻlgan bahoda sotib olishdagi mukofot summasi aks ettiriladi.","Hisobvaraqning kreditida mukofot amortizatsiyasi hamda sotilgan, qayta tasniflangan, berilgan va/yoki boshqa yoʻl bilan hisobdan chiqarilayotgan qimmatli qogʻozlarning mukofot summasi aks ettiriladi."],"10895":["boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar haqiqiy qiymatining oʻzgarish hisobi yuritiladi.","Hisobvaraqning debetida boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar haqiqiy qiymatining oʻsishi, shuningdek qimmatli qogʻozlar qadrsizlanganda, soʻndirilganda, sotishda yoki boshqa yoʻl bilan hisobdan chiqarilgan holatlarda oʻzlashtirilmagan zararlarni hisobdan chiqarish summasi aks…","Hisobvaraqning kreditida boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar haqiqiy qiymatining pasayishi, shuningdek qimmatli qogʻozlar qadrsizlanganda, soʻndirilganda, sotishda yoki boshqa yoʻl bilan hisobdan chiqarilgan holatlarda oʻzlashtirilmagan foydani hisobdan chiqarish summasi aks…"],"10899":["10895 hisobvaragʻida aks ettirilgan tuzatishlardan tashqari, investitsiyalarning qadrsizlanishi natijasida vujudga keladigan zararlarni qoplash uchun ajratiladigan mablagʻlar hisobi olib boriladi.","Hisobvaraqning debetida zaxiraning kamayish va/yoki hisobdan chiqarilgan summasi aks ettiriladi.","Hisobvaraqning kreditida tashkil etilgan zaxira summasi va/yoki zaxira summasining oʻsishi aks ettiriladi."],"10901":["bankning tijorat faoliyati uchun sotib olgan oltin, kumush va platina kabi qimmatbaho metallari hisobi olib boriladi.","Hisobvaraqning debetida sotib olingan qimmatbaho metallarning qiymati aks ettiriladi.","Hisobvaraqning kreditida sotilgan qimmatbaho metallarning qiymati aks ettiriladi."],"10905":["bankning tijorat faoliyati uchun sotib olgan tabiiy olmoslar, yoqutlar, zumradlar, sapfirlar, aleksandritlar, xom (tabiiy) va ishlov berilgan tarzdagi tabiiy marvarid, qahraboning noyob hosilalari kabi qimmatbaho toshlarning hisobi olib boriladi.","Hisobvaraqning debetida sotib olingan qimmatbaho toshlarning qiymati aks ettiriladi.","Hisobvaraqning kreditida sotilgan qimmatbaho toshlarning qiymati aks ettiriladi."],"10909":["bankning tijorat faoliyati uchun sotib olgan qimmatbaho metallardan yasalgan (oltin, kumush va boshqa) tangalarining hisobi olib boriladi.","Hisobvaraqning debetida sotib olingan qimmatbaho tangalarning qiymati aks ettiriladi.","Hisobvaraqning kreditida sotilgan qimmatbaho tangalarning qiymati aks ettiriladi."],"10999":["bankning tijorat faoliyati uchun sotib olgan qimmatbaho metallar, toshlar va tangalarining qadrsizlanishi natijasida yuzaga keladigan zararlarni qoplash uchun moʻljallangan mablagʻlari hisobi olib boriladi.","Hisobvaraqning debetida zaxiraning kamayish summasi yoki bekor qilingan summasi aks ettiriladi.","Hisobvaraqning kreditida baholangan ehtimoliy yoʻqotishlar summasi yoki zaxiraning oʻsish summasi aks ettiriladi."],"11101":["bank tomonidan sotib olingan debitorlik qarzlari — joʻnatilgan tovarlar, bajarilgan ish va koʻrsatilgan xizmatlar uchun oʻz mijozlari (mahsulot yetkazib beruvchi) tomonidan inkassoga qoʻyilgan toʻlov talabnomalarining hisobi olib boriladi.","Hisobvaraqning debetida bank tomonidan sotib olingan mijozlarning debitorlik qarzlarining nominal qiymati aks ettiriladi.","Hisobvaraqning kreditida qarzdorlar tomonidan toʻlangan debitorlik qarzlarining qiymati, qayta tasniflangan, 11103, 11105 hisobvaraqlarga oʻtkazilgan, shuningdek boshqa shaxslar hisobiga kechib yuborilgan debitorlik qarzlarining qiymati aks ettiriladi."],"11103":["belgilangan qoidalarga muvofiq muddati oʻtgan deb tasniflangan sotib olingan debitorlik qarzlarining hisobi olib boriladi.","Hisobvaraqning debetida qayta tasniflangan, 11101 hisobvaragʻidan ushbu hisobvaraqqa oʻtkazilgan bank tomonidan sotib olingan debitorlik qarzlarining toʻliq va/yoki toʻlanmagan qiymati aks ettiriladi.","Hisobvaraqning kreditida qarzdorlar tomonidan toʻlangan yoki hisobdan chiqarilgan debitorlik qarzlarining summasi, shuningdek qayta tasniflangan, 11105 hisobvaragʻiga oʻtkazilgan sotib olingan muddati oʻtgan debitorlik qarzlarining qiymati aks ettiriladi."],"11105":["bank tomonidan sotib olingan sud jarayonidagi debitorlik qarzlarining hisobi olib boriladi.","Hisobvaraqning debetida qayta tasniflangan, 11101, 11103 hisobvaraqlaridan ushbu hisobvaraqqa oʻtkazilgan bank tomonidan sotib olingan debitorlik qarzlarining toʻliq va/yoki toʻlanmagan qiymati aks ettiriladi.","Hisobvaraqning kreditida qarzdorlar tomonidan qoplangan yoki hisobdan chiqarilgan debitorlik qarzlari summasi aks ettiriladi."],"11195":["sotib olingan debitorlik qarzlarining toʻliq nominal qiymati bilan sotib olish narxi oʻrtasidagi salbiy farq, yaʼni diskont hisobi olib boriladi.","Hisobvaraqning debetida diskont amortizatsiyasi, shuningdek qarzdor tomonidan debitorlik qarzlarini qisman yoki toʻliq qoplash natijasida yoki boshqa shaxslar hisobiga kechib yuborilganda hisobdan chiqarilgan diskont summasi aks ettiriladi.","Hisobvaraqning kreditida bankning debitorlik qarzini uning toʻliq nominal qiymatidan past narxda sotib olgandagi diskont summasi aks ettiriladi."],"11199":["qarzdordan summa undirib olinmagan va/yoki baholashda summa undirib olinishiga shubha tugʻilgan hollarda sotib olingan debitorlik qarzlari boʻyicha koʻrilishi mumkin boʻlgan zararlarni qoplash uchun tashkil etilgan zaxira hisobi olib boriladi.","Hisobvaraqning debetida zaxiraning kamayish summasi va/yoki bekor qilingan summasi aks ettiriladi.","Hisobvaraqning kreditida tashkil etilgan zaxira summasi va/yoki zaxiraning oʻsish summasi aks ettiriladi."],"11501":["bank tomonidan chiqarilgan va importning qiymatini toʻlash va/yoki akseptlash bilan bogʻliq boʻlgan xarajatlarni qoplash uchun moʻljallangan, akkreditiv kafolati asosida taqdim etilgan, import yoki sotib olish/toʻlash vakolati bilan bogʻliq boʻlgan veksel/trattalarning hisobi yuritiladi.","Hisobvaraqning debetida tovarlar yoki xizmatlar import uchun chet el vakil bankidan qabul qilingan akkreditiv boʻyicha taqdim etilgan veksellarning summasi aks ettiriladi.","Hisobvaraqning kreditida mijozlarning hisobvaraqlariga qoʻyilgan akkreditiv asosidagi veksellarning toʻlangan summasi, shuningdek qayta tasniflangan, 11511 va 11519 hisobvaraqlariga oʻtkazilgan veksellar summasi aks ettiriladi."],"11503":["mijozlarning akkreditiv va kafolatlari bilan bogʻliq boʻlgan toʻlovlari hisobi yuritiladi.","Hisobvaraqning debetida mijozlarning akkreditiv va kafolatlari boʻyicha toʻlab berilgan summasi aks ettiriladi.","Hisobvaraqning kreditida mijozlar tomonidan qoplab berilgan summalar, shuningdek qayta tasniflangan, import bilan bogʻliq akkreditivlar boʻyicha 11511, 11519 hisobvaraqlariga, mahalliy akkreditivlar boʻyicha 11515, 11521 hisobvaraqlariga oʻtkazilgan summalar summasi aks ettiriladi."],"11505":["importyor tomonidan trast bitimi asosida tovarlarni olishga oid hujjatlar berilgunga qadar/berilgan vaqtda akseptlangan, akkreditiv kafolati boʻyicha import uchun taqdim qilingan veksel/trattalarning hisobi olib boriladi.","Hisobvaraqning debetida trast hujjatlari asosida akseptlangan va oʻtkazib berilgan, akkreditiv kafolati boʻyicha taqdim qilingan import bilan bogʻliq veksel/trattalarning summasi aks ettiriladi.","Hisobvaraqning kreditida mijozlar hisobraqamlaridan undirib olingan taqdim etilgan akkreditiv kafolati boʻyicha import bilan bogʻliq veksel/trattalarning, shuningdek qayta tasniflangan, 11511 va 11519 hisobvaraqlariga oʻtkazilgan veksellar summasi aks ettiriladi."],"11509":["akkreditiv va/yoki trast hujjatlari bilan kafolatlangan mahalliy veksel/trattalarning qiymati hisobi olib boriladi.","Hisobvaraqning debetida akkreditiv va/yoki trast hujjatlari kafolati boʻyicha taqdim qilingan mahalliy veksel/trattalarning summasi aks ettiriladi.","Hisobvaraqning kreditida akkreditiv va/yoki trast hujjatlari kafolati asosida taqdim etilgan mahalliy veksel/trattalar boʻyicha mijozlarning hisobvaraqlaridan undirib olinadigan summa, shuningdek qayta tasniflangan, 11511 va 11519 hisobvaraqlariga oʻtkazilgan veksellar summasi aks ettiriladi."],"11511":["amaldagi qoidalarga muvofiq muddati oʻtgan deb hisoblanadigan, akkreditiv va/yoki trast hujjati kafolati asosida berilgan muddatida toʻlanmagan import bilan bogʻliq veksel/trattalar hisobga olinadi.","Hisobvaraqning debetida qayta tasniflangan, 11501, 11505 hisobvaraqlaridan ushbu hisobvaraqqa oʻtkazilgan, akkreditiv va/yoki trast kelishuvlari kafola 502":["joriy davrda hisoblangan, lekin hali toʻlanmagan daromad (foyda) soliqlari (daromad (foyda) va qonunchilikka muvofiq ravishda boshqa shu kabi soliqlar)ning hisobi olib boriladi.","Hisobvaraqning debetida toʻlangan daromad (foyda) soliqlari summasi, shuningdek notoʻgʻri hisoblangan daromad (foyda) soliqlari summasi hisobdan chiqariladi.","Hisobvaraqning kreditida hisoblangan joriy daromad (foyda) soliqlari summasi aks ettiriladi."],"22504":["hisoblangan, lekin hali toʻlanmagan soliq (daromad (foyda) soligʻidan tashqari)lar hisobi olib boriladi.","Hisobvaraqning debetida toʻlangan soliqlarning hisobdan chiqarilgan summasi, shuningdek qaytarilgan notoʻgʻri hisoblangan summalar hisobdan chiqariladi.","Hisobvaraqning kreditida hisoblangan soliqlar summasi aks ettiriladi."],"22506":["qonunchilikka muvofiq bankning xodimlaridan ushlab qolgan va budjet daromadiga oʻtkaziladigan soliqlar hisobi olib boriladi.","Hisobvaraqning debetida budjetga oʻtkazilgan soliqlar summasi hisobdan chiqariladi.","Hisobvaraqning kreditida ushlab qolinadigan soliqlar summasi aks ettiriladi."],"22508":["muddati uzaytirilgan daromad soliqlar hisobga olinadi. Muddati uzaytirilgan daromad soligʻi bu, joriy davr soliqqa tortiladigan daromad(foyda)dan chegirib tashlanadigan, lekin kelgusi davrning soliqqa tortiladigan daromadi(foydasi)ga kiritiladigan vaqtinchalik farqlarni qoʻshgan holda kelgusi davrda toʻlanadigan daromad(foyda)…","Hisobvaraqning debetida muddati uzaytirilgan daromad soliqlarining kamaygan summasi aks ettiriladi.","Hisobvaraqning kreditida hisoblangan muddati uzaytirilgan daromad soliqlari summasi aks ettiriladi."],"22510":["qonunchilikka muvofiq ijtimoiy soliqqa oʻtkaziladigan bank tomonidan ushlab qolingan mablagʻlar hisobi olib boriladi.","Hisobvaraqning debetida ijtimoiy soliq oʻtkazilgan mablagʻlar summasi aks ettiriladi.","Hisobvaraqning kreditida ijtimoiy soliqqa oʻtkaziladigan bank tomonidan ushlab qolingan mablagʻlar summasi aks ettiriladi."],"22512":["Bandlikka koʻ va davlatning boshqa qimmatli qogʻozlarining, sotilmagan va mijozlarga qaytarilgan, shuningdek saqlanish hisobidan chiqarilgan davlatning qimmatli qogʻozlarining nominal qiymati aks ettiriladi."],"93623":["xususiy korxonalarning topshiriq, vositachilik yoki saqlash shartnomalariga asosan olingan qimmatli qogʻozlarining, shuningdek saqlanayotgan tijorat hujjatlarining hisobi olib boriladi. Ushbu hisobvaraq uchun 96379 balans hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida saqlash uchun qabul qilingan qimmatli qogʻozlar va tijorat hujjatlarining nominal qiymati, shuningdek topshiriq yoki vositachilik shartnomalariga asosan sotish uchun olingan xususiy korxonalarning qimmatli qogʻozlarining nominal qiymati aks ettiriladi.","Hisobvaraqning kreditida topshiriq yoki vositachilik shartnomalari boʻyicha sotilgan qimmatli qogʻozlarning, sotilmagan va mijozlarga qaytarilgan, shuningdek saqlanish hisobidan chiqarilgan xususiy korxonalarning qimmatli qogʻozlari va tijorat hujjatlarining nominal qiymati aks ettiriladi."],"93630":["mijozlarning depozitar yacheykalar saqlanayotgan qimmatliklar va hujjatlarning hisobi olib boriladi. Saqlanishga qabul qilingan qimmatliklar “donasi 1 soʻm” boʻlgan shartli bahoda hisobga olinadi. Ushbu hisobvaraq uchun 96379 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida shartli ravishda saqlanishga qabul qilingan qimmatliklar va boshqa hujjatlarning qiymati aks ettiriladi.","Hisobvaraqning kreditida egalariga qaytarilgan yoki oʻrnatilgan tartibga muvofiq ravishda ushbu hisobvaraqdan hisobdan chiqarilgan qimmatliklar va boshqa hujjatlarning qiymati aks ettiriladi."],"94501":["kreditlar, lizing va kafillik/bank kafolati taʼminotiga qabul qilingan qimmatli qogʻozlar hisobi olib boriladi. Qimmatli qogʻozlar qabul qilingan taʼminot summasida hisobga olinadi. Ushbu hisobvaraq uchun 96381 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida garov taʼminoti sifatida olingan qimmatli qogʻozlarning summasi aks ettiriladi.","Hisobvaraqning kreditida kreditlar, lizing va kafillik/bank kafolati qaytarilmaganda foydalanilgan taʼminot summasi, shuningdek kreditlar, lizing va kafillik/bank kafolati qaytarilgandan keyin hamda kredit, lizing va kafillik/bank kafolati shartnomalari yopilgandan keyin mijozlarga qaytarilgan qimmatli qogʻozlar summasi aks…"],"94502":["kredit, lizing va kafillik/bank kafolati taʼminotiga garov sifatida qabul qilingan mulklar va mulkiy huquq (talab)lar hisobi olib boriladi. Garov sifatida olingan mulklar va mulkiy huquq(talab)lar hisobvaraqqa garov boʻyicha shartnoma tuzilgan vaqtdagi baholangan qiymati boʻyicha kirim qilinadi. Ushbu hisobvaraq uchun 96381…","Hisobvaraqning debetida garov taʼminoti sifatida qabul qilingan mulklar va mulkiy huquq(talab)larning qiymati aks ettiriladi.","Hisobvaraqning kreditida garovga qabul qilingan foydalanilgan mulklar va mulkiy huquq(talab)larning summasi yoki kredit, lizing va kafillik/bank kafolati va ular boʻyicha hisoblangan foizlar qoplangandan (toʻlangandan) keyin qaytariladigan mulklar va mulkiy huquq(talab)larning summasi aks ettiriladi."],"94503":["kreditlar va/yoki lizing taʼminotiga qabul qilingan kafolat va kafilliklarning, shuningdek sugʻurta polislarining hisobi olib boriladi. Ushbu hisobvaraq uchun 96381 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida berilgan kreditlar va/yoki lizinglarning taʼminoti sifatida qabul qilingan kafolat va kafilliklarning summasi aks ettiriladi.","Hisobvaraqning kreditida kreditlar va/yoki lizinglar qaytarilmaganda foydalanilgan taʼminot summasi, shuningdek kreditlar qaytarilgandan keyin va kredit shartnomalari yopilgandan keyin kafolatlar va kafilliklarning muddati oʻtishi bilan oʻrnatilgan tartibda foydalanilmagan va bekor qilingan summasi aks ettiriladi."],"94504":["bank tomonidan olingan kreditlar va/yoki lizinglar boʻyicha garov sifatida berilgan qimmatli qogʻozlarning hisobi olib boriladi. Ushbu hisobvaraq uchun 96381 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida olingan kreditlar va/yoki lizinglar taʼminoti sifatida qarzdor-bank tomonidan berilgan qimmatli qogʻozlarning summasi aks ettiriladi.","Hisobvaraqning kreditida kredit qaytarilmaganda kreditor tomonidan foydalanilgan taʼminot summasi, shuningdek kreditlar va/yoki lizinglar qaytarilgandan keyin va kredit va/yoki lizinglar shartnomalari yopilgandan keyin qarzdor-bankka qaytarilgan qimmatli qogʻozlarning summasi aks ettiriladi."],"94505":["bank tomonidan olingan kreditlar boʻyicha bankning garovga qoʻyilgan depozitlari, asosiy vositalari, kreditlari va boshqa aktivlari hisobi olib boriladi. Ushbu hisobvaraq uchun 96381 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida bank tomonidan garovga qoʻyilgan depozitlari, asosiy vositalari, kreditlari va boshqa aktivlari summasi aks ettiriladi.","Hisobvaraqning kreditida garovdan chiqarilgan bankning depozitlari, asosiy vositalari, kreditlari va boshqa aktivlari summasi aks ettiriladi."],"94511":["boshqa aktivlar boʻyicha garov sifatida taʼminotga qabul qilingan qimmatli qogʻozlar hisobi olib boriladi. Ushbu hisobvaraq uchun 96381 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida boshqa aktivlar taʼminoti sifatida olingan qimmatli qogʻozlarning summasi aks ettiriladi.","Hisobvaraqning kreditida boshqa aktivlar qaytarilmaganda foydalanilgan taʼminot summasi, shuningdek boshqa aktivlar qaytarilgandan keyin va boshqa aktivlar shartnomalari yopilgandan keyin mijozlarga qaytarilgan qimmatli qogʻozlar summasi aks ettiriladi."],"94512":["boshqa aktivlar boʻyicha garov sifatida taʼminotga qabul qilingan mulklar va mulkiy huquq (talab)lar hisobi olib boriladi. Garov sifatida olingan mulklar va mulkiy huquq(talab)lar hisobvaraqqa garov boʻyicha shartnoma tuzilgan vaqtdagi baholangan qiymati boʻyicha kirim qilinadi. Ushbu hisobvaraq uchun 96381 balansdan tashqari…","Hisobvaraqning debetida garov taʼminoti sifatida qabul qilingan mulklar va mulkiy huquq(talab)larning qiymati aks ettiriladi.","Hisobvaraqning kreditida garovga qabul qilingan foydalanilgan mulklar va mulkiy huquq(talab)larning summasi boʻyicha hisoblangan foizlar qoplangandan (toʻlangandan) keyin qaytariladigan mulklar va mulkiy huquq(talab)larning summasi aks ettiriladi."],"94513":["boshqa aktivlar boʻyicha taʼminotga qabul qilingan kafolat va kafilliklar hisobi olib boriladi. Ushbu hisobvaraq uchun 96381 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida berilgan boshqa aktivlar taʼminoti sifatida qabul qilingan kafolat va kafilliklarning summasi aks ettiriladi.","Hisobvaraqning kreditida boshqa aktivlar boʻyicha foydalanilgan taʼminot summasi, shuningdek boshqa aktivlar qaytarilgandan keyin va boshqa aktivlar boʻyicha shartnomalar yopilgandan keyin kafolatlar va kafilliklarning muddati oʻtishi bilan oʻrnatilgan tartibda foydalanilmagan va bekor qilingan summasi aks ettiriladi."],"95409":["garovga olingan mol-mulkning qarzdorlarga/debitorlarga berilgan kreditning toʻlanmagan summasi bilan solishtirilgandagi kam chiqqan qiymati natijasida qarzdorlarga/debitorlarga bildirilgan daʼvolar boʻyicha olinadigan mablagʻlar hisobi olib boriladi. Ushbu hisobvaraq uchun 96397 balansdan tashqari hisobvaraq kontr-hisobvaraq…","Hisobvaraqning debetida garovga olingan mol-mulkning berilgan kreditning toʻlanmagan summasi bilan solishtirilgandagi kam chiqqan qiymati natijasida qarzdorlarga/debitorlarga bildirilgan daʼvolar boʻyicha olinadigan mablagʻlar aks ettiriladi.","Hisobvaraqning kreditida kredit qarzlari boʻyicha qarzdorlarga/debitorlarga bildirilgan daʼvolar asosida undirib olingan mablagʻlar summasi yoki oʻrnatilgan tartibga muvofiq ravishda hisobdan chiqarilgan qarzlar summasi aks ettiriladi."],"95411":["muddatida toʻlanmagan qimmatli qogʻozlar boʻyicha va sud jarayonidagi qimmatli qogʻozlar boʻyicha olinishi lozim boʻlgan hisoblangan foizlar hisobi olib boriladi. Ushbu hisobvaraq uchun 96333 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida muddatida toʻlanmagan qimmatli qogʻozlar boʻyicha, shuningdek sud jarayonidagi qimmatli qogʻozlar boʻyicha olinishi lozim boʻlgan hisoblangan foizlar aks ettiriladi.","Hisobvaraqning kreditida muddatida toʻlanmagan qimmatli qogʻozlar boʻyicha, shuningdek sud jarayonidagi qimmatli qogʻozlar boʻyicha undirib olingan foizlar summasi aks ettiriladi."],"95413":["bank balansidan hisobdan chiqarilgan kreditlar, lizinglar va/yoki faktoringlar (toʻlanmagan qismi)ning hisobi olib boriladi. Ushbu hisobvaraq uchun 96397 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida hisobdan chiqarilgan kredit, lizinglar va faktoringlar summasi aks ettiriladi.","Hisobvaraqning kreditida qayta tiklangan yoki toʻlangan kreditlar, lizinglar va/yoki faktoringlarning, shuningdek oʻrnatilgan muddati oʻtishi bilan bekor qilingan kreditlar, lizinglar va/yoki faktoringlarning summasi aks ettiriladi."],"95415":["amaldagi qoidalarga muvofiq ravishda bank balansidan hisobdan chiqarilgan boshqa aktivlar (toʻlanmagan qismi)ning hisobi olib boriladi. Ushbu hisobvaraq uchun 96397 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida hisobdan chiqarilgan boshqa aktivlar summasi aks ettiriladi.","Hisobvaraqning kreditida qayta tiklangan yoki toʻlangan boshqa aktivlarning, shuningdek oʻrnatilgan muddati oʻtishi bilan bekor qilingan boshqa aktivlarning summasi aks ettiriladi."],"95497":["yuqoridagi turkum hisobvaraqlar taʼrifiga mos tushmaydigan operatsiyalar hisobi olib boriladi. Ushbu hisobvaraq uchun 96397 balansdan tashqari hisobvaraq kontr-hisobvaraq hisoblanadi.","Hisobvaraqning debetida kirim qilingan mablagʻlar, hujjatlar yoki boshqa qimmatbaho buyumlarning qiymati aks ettiriladi.","Hisobvaraqning kreditida hisobdan chiqarilgan mablagʻlar, hujjatlar yoki boshqa qimmatbaho buyumlarning summasi aks ettiriladi."]},ENT=[["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","1. Asosiy vositalar, bino (inshootlar)ni qurilishi (rekonstruksiyasi) bilan bogʻliq boʻlgan loyiha-qidiruv ishlari, qurilish materiallari, mehnat, xarajatlar hamda asosiy vositalar sotib olish bilan bogʻliq boʻlgan boshqa kapitallashtiriladigan xarajatlar qiymatini toʻliq yoki qisman oldindan toʻlash quyidagi buxgalteriya yozuvlari bilan rasmiylashtiriladi:",["1)","Dt 19909","“Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun” yoki","Dt 19907","“Xizmatlar uchun oldindan toʻlangan xarajatlar”;","Kt","Bankning vakillik hisobvaragʻi yoki mijoz (mol yetkazib beruvchi)ning talab qilib olinguncha saqlanadigan depozit hisobvaragʻi, agarda unga ushbu bank tomonidan xizmat koʻrsatilsa;","2) sotib olingan bino (inshoot) balansda quyidagi buxgalteriya oʻtkazmasi bilan aks ettiriladi:","Dt 16509","“Bankning imoratlari — Binolar va boshqa inshootlar”;","Kt 19909","“Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun” yoki","Kt 19907","“Xizmatlar uchun oldindan toʻlangan xarajatlar”;"]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","2. Agar bank moddiy aktivlarni kirim qilgandan soʻng toʻlovni amalga oshirsa, kirim hujjatlari asosida quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) moddiy aktivlar kelib tushganda ularni balansda aks ettirish:","a) asosiy vositalar kelib tushishi bilan darhol foydalanishga topshirilgan taqdirda:","Dt 165XX","Asosiy vositalarning tegishli hisobvaragʻi yoki","16505","“Tugallanmagan qurilishlar” (agar rekonstruksiya qilinishi talab etiladigan binolar, Tugallanmagan qurilishlar yoki qurilish uchun materiallar xarid qilinsa (2);","Kt 29802","“Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”;","b) asosiy vositalarni omborga kirim qilish:","Dt 16561","“Ombordagi asosiy vositalar”;","Kt 29802","“Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”;","2) aktivlar qiymati toʻlanganda:"]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","3. Asosiy vositalar tekinga olinganda quyidagi buxgalteriya oʻtkazmasi rasmiylashtiriladi. Tekinga olingan asosiy vositalarning haqqoniy qiymatiga:",["Dt 165XX","Asosiy vositalarning tegishli hisobvaragʻi yoki","Dt 16561","“Ombordagi asosiy vositalar” (agar omborga kirim qilinsa);","Kt 45994","“Boshqa foizsiz daromadlar”.","Bunda paydo boʻladigan bir yoʻla xarajatlar joriy xarajatlarga hisobdan chiqariladi."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","4. Asosiy vositalar subsidiya koʻrinishida olinganda quyidagi oʻtkazma bajariladi:",["Dt 165XX","Asosiy vositalarning tegishli hisobvaragʻi;","Kt 22896","“Boshqa muddati uzaytirilgan daromadlar”."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","5. Agar banklar (amaldagi qonun hujjatlariga muvofiq soliqlar toʻlashdan ozod qilingan) soliq solishdan boʻshatilgan mablagʻlar hisobiga bank infratuzilmasini rivojlantirish doirasida asosiy vositalarni xarid qilib, ularning qiymatini 30903 — “Umumiy zaxira fondi” balans hisobvaragʻining “Bank infratuzilmasini rivojlantirishga sarflangan mablagʻlar” shaxsiy hisobvaragʻiga kiritgan boʻlsalar, quyidagi teskari oʻtkazma…",["Dt 30903","“Umumiy zaxira fondi”","“Bank infratuzilmasini rivojlantirishga yoʻnaltirilgan mablagʻlar” sh/h;","Kt 30903","“Umumiy zaxira fondi”","“Bank infratuzilmasini rivojlantirishga sarflangan mablagʻlar” sh/h."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","6. Bank undirilgan mol-mulkni oʻz asosiy vositalari sifatida ishlatishga qaror qilganda, quyidagi buxgalteriya oʻtkazmalari aks ettiriladi:",["Dt 165XX","Asosiy vositalarning tegishli hisobvaragʻi;","Dt 16799","“Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Bankning boshqa xususiy mulklari (kontr-aktiv)”;","Kt 16701","“Kredit va lizing boʻyicha garov hisobidan undirilgan mulk”."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","7. Asosiy vositalarni qayta baholashda quyidagi buxgalteriya yozuvlari amalga oshiriladi:",["1) agar aktivning qayta baholangan qiymati uning balans qiymatidan oshganda:","a)","Dt 165XX","Asosiy vositalarning tegishli hisobvaragʻi;","Kt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","b) qayta baholashdan oldin va undan keyingi yigʻilgan eskirish summalari oʻrtasidagi farqqa:","Dt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","Kt 165XX","Yigʻilgan eskirish — Asosiy vositalarning tegishli hisobvaragʻi;","v) qayta baholash natijasida asosiy vosita qiymatining koʻpayish summasi xarajat sifatida tan olingan ushbu aktiv qiymatining oldingi arzonlashish summasini qoplashi darajasidagina daromad sifatida tan olinishi lozim;","2) qayta baholash natijasida asosiy vositalarning haqqoniy qiymatining kamayishi xarajat sifatida tan olinadi. Ushbu summa bevosita 30908 — “Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi” hisobvaragʻining tegishli moddasidan, biroq xuddi oʻsha asosiy vositaga nisbatan oldingi…","a) qayta baholashdan oldin va undan keyingi yigʻilgan eskirish summalari oʻrtasidagi farqqa:"]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","8. 30908 — “Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi” hisobvaragʻida aks ettirilgan qayta baholashning ijobiy natijasi har oyda 31203 — Taqsimlanmagan foyda (aktiv-passiv)” hisobvaragʻiga hisobdan chiqariladi. Bunda quyida buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","Kt 31203","“Taqsimlanmagan foyda (aktiv-passiv)”.","Tegishli aktivni hisobdan chiqarishda 30908 — hisobvaraqdagi qayta baholash natijasi toʻligʻicha 31203 — hisobvaraqqa oʻtkaziladi."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","9. Asosiy vositalar amortizatsiyasi quyidagi buxgalteriya oʻtkazmasi bilan bank xarajatlariga olib boriladi:",["Dt 566XX","Asosiy vositalar tegishli guruhlarining eskirishi xarajatlari;","Kt 165XX","Yigʻilgan eskirish summasi — Asosiy vositalarning tegishli hisobvaragʻi."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","10. Asosiy vositalarning qoldiq qiymati ularning chiqib ketishida quyidagi tarzda aniqlanadi:",["1) eskirish summasiga:","Dt 165XX","“Yigʻilgan eskirish summasi — Asosiy vositalarning tegishli hisobvaragʻi”;","Kt 165XX","Asosiy vositalarning tegishli hisobvaragʻi;","2) mazkur asosiy vositalar obyekti boʻyicha 30908 — hisobvaraqda bor boʻlgan qoldiq summasiga:","Dt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","Kt 31203","“Taqsimlanmagan foyda (aktiv-passiv)”."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","11. Hisobdan chiqariladigan asosiy vositalar sotilganda quyidagi buxgalteriya oʻtkazmalari bajariladi:",["1) agar toʻlov xaridorlar tomonidan asosiy vositalar olingandan soʻng amalga oshirilgan holda:","Dt 19909","“Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”;","Kt 165XX","Asosiy vositalarning tegishli hisobvaragʻi;","2) toʻlov kelib tushgandan keyingi buxgalteriya yozuvlari:","a) aktivni sotish summasiga:","Dt","Bank vakillik hisobvaragʻi yoki xaridor hisobvaragʻi;","Kt 29802","“Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”;","b) agar sotish narxi asosiy vositalarning qoldiq qiymatidan katta boʻlsa:","Dt 29802","“Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun” — sof tushum summasiga;"]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","12. Toʻliq jismonan yoki maʼnan eskirganligi munosabati bilan yaroqsiz holga kelgan, kamomad yoki talafot aniqlanganda (aybdor shaxslar aniqlanmagan holda), fors-major holatlarida, tekinga berilganda asosiy vositalarning qiymati belgilangan tartibda zararga hisobdan chiqarilganda:",["qoldiq qiymati summasiga:","Dt 55902","“Bank asosiy vositalarini sotish yoki dispozitsiya qilishdan koʻrilgan zararlar”;","Kt 165XX","Asosiy vositalarning tegishli hisobvaragʻi."]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","13. Asosiy vositalar bosh bankdan filialga berilganda quyidagi buxgalteriya oʻtkazmalari bajariladi:",["1) bosh bankda:","a)","Dt 16104","“Bosh ofis/filiallardan olinadigan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar” — “qayta baholash natijasi” ayirilgan holda qoldiq qiymati;","Dt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi” — qayta baholash natijasi;","Dt 165XX","Yigʻilgan eskirish summasi — Asosiy vositalarning tegishli hisobvaragʻi;","Kt 165XX","Asosiy vositalarning tegishli hisobvaragʻi — yalpi balans qiymati;","b) agar asosiy vositalar omborda berilsa:","Dt 16104","“Bosh ofis/filiallardan olinadigan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar” — “qayta baholash natijasi” ayirilgan holda qoldiq qiymati;","Dt 30908"]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","14. Yagona balans hisobotida jamlashda oʻzaro hisobvaraqlar (16104 va 22205) chiqarib tashlanadi va balans hisobotida aks ettirilmaydi.",[]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","15. Asosiy vositalarning haqiqatda mavjudligi va ularning butligini nazorat qilish maqsadida bank tomonidan oʻtkazilgan inventarlashda aniqlangan ortiqcha asosiy vositalar balansga baholangan qiymati boʻyicha quyidagi tarzda kirim qilinadi:",["Dt 165XX","Asosiy vositalarning tegishli hisobvaragʻi;","Kt 45994","“Boshqa foizsiz daromadlar”;"]],["1-bob. Asosiy vositalarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","16. Bank xodimining aybiga koʻra yaroqsiz holga kelgan asosiy vositalarning qiymati yoki kamomad aniqlanganda ushbu asosiy vositalarning qiymati qonunchilikda belgilangan tartibda aybdor va moddiy-javobgar shaxslardan undiriladi. Zarar miqdori, bank mulkiga yetkazilgan zarar uchun xodimning moddiy javobgarligi chegaralari va tartibi Oʻzbekiston Respublikasi mehnat qonunchiligiga muvofiq belgilanadi. Bunda quyidagi yozuv…",["1) yigʻilgan eskirish summasiga:","Dt 165XX","Yigʻilgan eskirish — Asosiy vositalarning tegishli hisobvaragʻi;","Kt 165XX","Asosiy vositalarning tegishli hisobvaragʻi;","2) agar unidirilishi lozim boʻlgan summa aktivning qoldiq qiymatidan katta boʻlsa:","Dt 19908","“Bank xodimlari bilan hisob-kitoblardagi olinishi lozim boʻlgan mablagʻlar” — aybdor shaxslardan undirilishi lozim boʻlgan qiymatga;","Kt 165XX","Asosiy vositalarning tegishli hisobvaragʻi — qoldiq qiymati, va/yoki","Kt 45994","“Boshqa foizsiz daromadlar” — aktivning undirilishi lozim boʻlgan va qoldiq qiymati oʻrtasidagi farq summasiga;","3) agar unidirilishi lozim boʻlgan summa aktivning qoldiq qiymatidan kichik boʻlsa:","Dt 19908"]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","17. Nomoddiy aktivlar qiymatini oldindan toʻlash orqali balansga kirim qilish quyidagi buxgalteriya yozuvlari bilan rasmiylashtiriladi:",["1) Aktivlar qiymati toʻlanganda:","Dt 19909","“Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”;","Kt","Bankning vakillik hisobvaragʻi yoki mijozning hisobvaragʻi;","2) Aktivlar kelib tushganda ularni balansda aks ettirish:","Dt 16601","“Nomoddiy aktivlar”;","Kt 19909","“Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”;"]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","18. Agar bank nomoddiy aktivlar kelib tushgandan keyin toʻlovni amalga oshirsa, quyidagi buxgalteriya oʻtkazmalari bajariladi:",["1) Nomoddiy aktivlar kelib tushganda ularni balansda aks ettirish:","Dt 16601","“Nomoddiy aktivlar”;","Kt 29802","“Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”;","2) Aktivlar qiymati toʻlanganda:","Dt 29802","“Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”;","Kt","Bankning vakillik hisobvaragʻi yoki mijozning hisobvaragʻi;"]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","19. Nomoddiy aktivlar tekinga olinganda tekinga olingan nomoddiy aktivlarning real qiymatiga quyidagi buxgalteriya oʻtkazmasi rasmiylashtiriladi:",["Dt 16601","“Nomoddiy aktivlar”;","Kt 45994","“Boshqa foizsiz daromadlar”."]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","20. Qayta baholashdan soʻng aktivlarning haqqoniy qiymati ularning balans qiymati va yigʻilgan eskirishi bilan taqqoslanadi va farq summasiga tegishli buxgalteriya yozuvlari amalga oshiriladi.",["1) Agar aktivning qayta baholangan qiymati uning balans qiymatidan oshsa, bu oshish 30908 — “Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi” hisobvaragʻida quyidagi buxgalteriya yozuvi bilan aks ettiriladi:","a)","Dt 16601","“Nomoddiy aktivlar”;","Kt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","b) qayta baholashdan oldin va undan keyingi yigʻilgan eskirish summalari oʻrtasidagi farqqa:","Dt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","Kt 16605","“Yigʻilgan eskirish summasi — Nomoddiy aktivlar (kontr-aktiv)”;","2) qayta baholash natijasida nomoddiy aktivlar qiymatining koʻpayish summasi ilgari xarajat sifatida tan olingan ushbu aktiv qiymatining kamayish summasini qoplashi darajasidagina daromad sifatida tan olinishi lozim;","3) Agar aktivning qayta baholangan qiymati balans qiymatidan kam boʻlsa, aktiv summasi kamayadi va bu kamayish quyidagi buxgalteriya yozuvi bilan rasmiylashtiriladi:","a) qayta baholashdan oldin va undan keyingi yigʻilgan eskirish summalari oʻrtasidagi farqqa:"]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","21. 30908 — “Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi” hisobvaragʻiga kiritilgan qayta baholashning musbat natijasi har oyda 31203 — “Taqsimlanmagan foyda (aktiv-passiy)” hisobvaragʻiga bevosita hisobdan chiqariladi. Bunda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","Kt 31203","“Taqsimlanmagan foyda (aktiv-passiv)”.","Ushbu holda qayta baholash musbat natijasining har oyda hisobdan chiqariladigan summasi tegishli aktiv tiklash qiymatining eskirish summasi va boshlangʻich qiymatining eskirish summasi oʻrtasidagi farqqa teng."]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","22. Nomoddiy aktivlar amortizatsiya ajratmalari quyidagi buxgalteriya oʻtkazmasi bilan bank xarajatlariga kiritiladi:",["Dt 56618","“Eskirish — Nomoddiy aktivlar”;","Kt 16605","“Yigʻilgan eskirish summasi — Nomoddiy aktivlar (kontr-aktiv)”."]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","23. Nomoddiy aktivlar chiqib ketishida ularning qoldiq qiymati quyidagi tarzda aniqlanadi:",["1) yigʻilgan eskirish summasiga:","Dt 16605","“Yigʻilgan eskirish summasi — Nomoddiy aktivlar (kontr-aktiv)”;","Kt 16601","“Nomoddiy aktivlar”;","2) mazkur nomoddiy aktiv boʻyicha 30908 — hisobvaraqda bor boʻlgan qoldiq summasiga:","Dt 30908","“Boshlangʻich qiymatiga nisbatan baholash qiymatining oshgan summasi”;","Kt 31203","“Taqsimlanmagan foyda (aktiv-passiv)”."]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","24. Hisobdan chiqariladigan nomoddiy aktivlar sotilganda quyidagi buxgalteriya oʻtkazmalari bajariladi:",["1) nomoddiy aktivlar yetkazib berilgandan soʻng xaridor tomonidan toʻlov amalga oshirilgan holda:","Dt 19909","“Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”;","Kt 16601","“Nomoddiy aktivlar”;","2) toʻlov kelib tushgandan keyingi buxgalteriya yozuvlari:","a) agar sotish narxi nomoddiy aktivlarning qoldiq qiymatidan katta boʻlsa:","Dt","Bank vakillik hisobvaragʻi yoki xaridor hisobvaragʻi;","Kt 19909","Kt 45913","“Tovar-moddiy qimmatliklari uchun toʻlangan mablagʻlar” yoki","“Bankning boshqa xususiy mulklarini sotish yoki dispozitsiya qilishdan foyda”;","b) agar sotish narxi nomoddiy aktivlarning qoldiq qiymatidan kichik boʻlsa:"]],["2-bob. Nomoddiy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlar","25. Toʻliq eskirganligi munosabati bilan, fors-major holatlarida, tekinga berilganda nomoddiy aktivlarning qiymati belgilangan tartibda zararga hisobdan chiqariladi va quyidagi oʻtkazma bilan rasmiylashtiriladi:",["qoldiq qiymati summasiga:","Dt 55906","“Bankning boshqa xususiy mulklarini sotish yoki dispozitsiya qilishdan koʻrilgan zararlar”;","Kt 16601","“Nomoddiy aktivlar”."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","26. Bank tomonidan kredit berilganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 11900 — 15500 (tegishli ssuda hisobvaragʻi);","Kt 10301","“OʻzRMBdagi vakillik hisobvaragʻidan olinishi lozim boʻlgan mablagʻlar — Nostro” (agar mablagʻ oluvchiga boshqa bank tomonidan xizmat koʻrsatilsa) yoki","Kt 202XX","Mablagʻ oluvchining talab qilib olunguncha depozit hisobvaragʻi (agar mablagʻ oluvchiga mazkur bankda xizmat koʻrsatilsa) yoki","Kt 10101","“Aylanma kassadagi naqd pullar” (kredit naqd pulda berilganda)."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","27. Banklar tomonidan yuqoridagi xizmatlar uchun potensial qarz oluvchilardan vositachilik haqi olinayotganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 202XX","Qarz oluvchining talab qilib olunguncha depozit hisobvaragʻi;","Kt 22896","“Boshqa muddati uzaytirilgan daromadlar”."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","28. Bank koʻrilishi mumkin boʻlgan zararlarni baholashni quyidagicha aks ettiradi:",["Dt 56802","“Koʻrilishi mumkin boʻlgan zararlarni baholash — Kreditlar”;","Kt XXX99","Kreditlar boʻyicha koʻrilishi mumkin boʻlgan zararlar zaxirasi — Kreditning tegishli kategoriyasi (kontr — aktiv)."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","29. Agar kredit portfelining keyingi tahlili natijasida uning zaxiralari talablardan oshsa, bank zaxira summasini oxirgi sana holati boʻyicha aniqlangan, koʻrilishi mumkin boʻlgan zararlar summasiga muvofiqlashtirishi lozim. Bunda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt XXX99","“Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Kreditning tegishli kategoriyasi (kontr — aktiv)”;","Kt 56802","“Koʻrilishi mumkin boʻlgan zararlarni baholash — Kreditlar” (hisobot yilida shakllantirilgan zaxiralar boʻyicha) yoki","Kt 45921","“Hisobdan chiqarilgan mablagʻlarning qaytarilishi” yoki Kt 45924 “Hisobdan chiqarilgan aktivlarning qaytarilishi (oldingi hisobot yillarida shakllantirilgan zaxiralar boʻyicha)."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","30. Kreditlarni qaytarilishi qarz oluvchining asosiy, shuningdek ikkilamchi talab qilib olinguncha depozit hisobvaraqlaridan quyidagi buxgalteriya oʻtkazmasi orqali amalga oshiriladi:",["Dt 202XX","Qarz oluvchining talab qilib olunguncha depozit hisobvaragʻi;","Kt","Ssuda hisobvaragʻi.","Agar kredit kafolat beruvchi (kafil) tomonidan qaytarilsa, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 202XX","Kafolat beruvchi (kafil)ning talab qilib olinguncha depozit hisobvaragʻi yoki","Dt 10301","“OʻzRMBdagi vakillik hisobvaragʻidan olinishi lozim boʻlgan mablagʻlar — Nostro” (agar mablagʻ oluvchiga boshqa bank tomonidan xizmat koʻrsatilsa);","Kt","Ssuda hisobvaragʻi.","Kreditlar naqd pulda qaytarilganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 10101","“Aylanma kassadagi naqd pullar”;"]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","31. Kreditlar boʻyicha foizlar tushumi quyidagi buxgalteriya oʻtkazmasi orqali aks ettiriladi:",["Dt 202XX","Qarz oluvchining talab qilib olunguncha depozit hisobvaragʻi;","Kt 16309","“Kreditlar boʻyicha hisoblangan foizlar”."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","32. Qarzdor tomonidan garov bilan taʼminlanmagan kredit qaytarilmasa yoki toʻliq qaytarilmaganda, ularni shakllantirilgan zaxira hisobidan hisobdan chiqarish quyidagi buxgalteriya oʻtkazmasi orqali amalga oshiriladi:",["Dt XXX99","Kreditlar boʻyicha koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi Kreditning tegishli kategoriyasi (kontr-aktiv);","Kt","Ssuda hisobvaragʻi."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","33. Garov bilan taʼminlangan kredit qarzdor tomonidan qaytarilmasa yoki toʻliq qaytarilmagan holda, bank kreditni qaytarish uchun undiruvni garovga qoʻyilgan mol-mulkka qaratishga haqli. Undiruvga qaratilgan garovga qoʻyilgan mol-mulkni sotish kim-oshdi savdosi orqali qonun hujjatlarida belgilangan tartibda amalga oshiriladi. Garovga qoʻyilgan mol-mulkni sotishdan mablagʻlar kelib tushganda 10301 — “Markaziy bankdagi…",["Kreditlar boʻyicha asosiy qarzni va mazkur kredit boʻyicha hisoblangan, lekin hali olinmagan foizlarni soʻndirish quyidagi buxgalteriya oʻtkazmasi orqali amalga oshiriladi:","a) Asosiy qarz qaytarilganda:","Dt 29801","“Mijozlar bilan hisob-kitoblar”;","Kt","Ssuda hisobvaragʻi;","b) Asosiy qarz toʻliq qaytarilgandan keyin, foizlar soʻndirilganda:","Dt 29801","“Mijozlar bilan hisob-kitoblar”;","Kt 4XXXX","Kreditlar boʻyicha foizli daromadlar."]],["3-bob. Kreditlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","34. Kredit garovga olingan mol-mulkni oʻz egaligiga olish yoʻli bilan qaytarilgan taqdirda, kreditning balans qiymati va garovga qoʻyilgan mol-mulkning haqqoniy qiymatidan qaysi biri kam boʻlsa, oʻsha qiymat boʻyicha, uni sotish boʻyicha qilingan xarajatlarni chegirgan holda, lekin qayta savdodagi dastlabki sotuv bahosidan 10 foiz kam boʻlmagan summada quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 16701","“Kredit va lizing boʻyicha garov hisobidan undirilgan mulk”;","Kt","Ssuda hisobvaragʻi."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","35. Kam baholi va tez eskiruvchi buyumlarning (bundan buyon matnda KBTEB deb yuritiladi) qiymatini oldindan toʻlab berish bilan sotib olish:",["1) KBTEBni oldindan toʻliq yoki qisman toʻlanishi quyidagi buxgalteriya yozuvlari bilan rasmiylashtiriladi:","Dt 19909 “Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”","Kt Bankning vakillik hisobvaragʻi yoki mijozning talab qilib olinguncha depozit hisobvaragʻi (agar mol yetkazib beruvchining talab qilib olinguncha depozit hisobvaragʻiga shu bankda xizmat koʻrsatilsa);","2) KBTEB omborxonaga sotib olinganligini tasdiqlovchi birlamchi hujjatlar asosida kirim qilinib, quyidagi buxgalteriya oʻtkazmasi bilan rasmiylashtiriladi:","Dt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”","Kt 19909 “Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","36. Agar toʻlov KBTEB kelib tushgandan keyin amalga oshirilsa, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["1) KBTEB kelib tushganda:","Dt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”","Kt 29802 “Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”;","2) KBTEB qiymati toʻlanganda:","Dt 29802 “Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”","Kt Bankning vakillik hisobvaragʻi yoki mijozning talab qilib olinguncha depozit hisobvaragʻi (agar mol yetkazib beruvchining talab qilib olinguncha boʻlgan depozit hisobvaragʻiga shu bankda xizmat koʻrsatilsa)."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","37. KBTEB Bosh bank/filialdan filiallar/bosh bankka berilganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 16104 “Bosh ofis/filiallardan olinadigan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar”;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","38. KBTEB Bosh bankdan filialga qabul qilinganda boshlangʻich hujjatlar (yuk xatlari) asosida quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”;","Kt 22205 “Bosh ofis/filiallarga toʻlanadigan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","39. Omborga qabul qilingan KBTEBda biror bir nomuvofiqlik yoki nuqson topilganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["1) Bankning daʼvosi mol yetkazib beruvchi tomonidan qabul qilinganda yoki sud tomonidan tegishli qaror chiqarilganda, omborga kirim qilingan KBTEBni mol yetkazib beruvchiga qaytarish quyidagi buxgalteriya oʻtkazmasi bilan amalga oshiriladi:","Dt 19909 “Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”;","2) Qaytarilgan mablagʻlarni qayta yozuv bilan vakillik hisobvaragʻiga oʻtkazishda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt Bankning vakillik hisobvaragʻi;","Kt 19909 “Olinishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar uchun”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","40. Banklar KBTEBni sof sotish qiymatigacha hisobdan chiqarishni quyidagi buxgalteriya oʻtkazmasi bilan amalga oshiradilar:",["Dt 56895 “Koʻrilishi mumkin boʻlgan zararlarni baholash — Boshqa aktivlar”;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","41. KBTEBni foydalanishga berish quyidagi buxgalteriya oʻtkazmasi bilan rasmiylashtiriladi:",["Dt 56406 “Devonxona, ofis va boshqa buyumlar xarajatlari”;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","42. Bank ortiqcha KBTEBni sotganda (KBTEB shartnomada kelishilgan narxlarda sotiladi) quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) KBTEBni sotish summasiga:","Dt Bankning vakillik hisobvaragʻi yoki sotib oluvchining talab qilib olinguncha depozit hisobvaragʻi, agar sotib oluvchiga shu bankda xizmat koʻrsatilsa;","Kt 29802 “Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun”;","2) KBTEB bank uchun foyda yoki zararsiz sotilganda:","Dt 29802 “Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun” — sof tushum summasiga (Sof tushum deganda shartnoma bahosidan qoʻshilgan qiymat soligʻi va aksizlarni ayirib tashlagandan keyingi summa nazarda tutiladi);","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”;","3) KBTEB foyda bilan sotilganda:","Dt 29802 “Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun” — sof tushum summasiga;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”;","Kt 45913 “Bankning boshqa xususiy mulklarini sotish yoki dispozitsiya qilishdan olingan foyda” — sof tushum va balans qiymati oʻrtasidagi farq summasiga;","4) KBTEB zarar bilan sotilganda:","Dt 29802 “Toʻlanishi lozim boʻlgan mablagʻlar — Tovar-moddiy qimmatliklar va xizmatlar uchun” — sof tushum summasiga;","Dt 55906 “Bankning boshqa xususiy mulklarini sotish yoki dispozitsiya qilishdan koʻrilgan zararlar” — sof tushum va balans qiymati oʻrtasidagi farq summasiga;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","43. Kamomad chiqqan, yaroqsiz holga kelgan (aybdor shaxslar aniqlanmagan holda), tekinga berilgan, shuningdek fors-major holatlarda KBTEBning qiymati, bank tomonidan belgilangan tartibda zararga chiqariladi va quyidagi buxgalteriya yozuvi bilan rasmiylashtiriladi:",["Dt 56795 “Boshqa operatsion xarajatlar”;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","44. KBTEBning kamomadi, shuningdek aybdor shaxsning aybi bilan yaroqsiz holga kelgan (aybdor shaxs aniqlanganda) KBTEBning qiymati quyidagi buxgalteriya yozuvi orqali rasmiylashtiriladi:",["Dt 19908 “Olinishi lozim boʻlgan mablagʻlar — Bank xodimlari bilan hisob-kitoblar”;","Kt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”.","Aybdor xodimlarning ish haqidan undirib olinganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 29803 “Toʻlanishi lozim boʻlgan mablagʻlar — Xodimlar bilan hisob-kitoblar”;","Kt 19908 “Olinishi lozim boʻlgan mablagʻlar — Bank xodimlari bilan hisob-kitoblar”.","Belgilangan tartibda bank xodimidan kassa orqali undirib olinganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 10101 “Aylanma kassadagi naqd pullar”;","Kt 19908 “Olinishi lozim boʻlgan mablagʻlar — Bank xodimlari bilan hisob-kitoblar”."]],["4-bob. Kam baholi va tez eskiruvchi buyumlarning buxgalteriya hisobini yuritish boʻyicha b","45. Omborda hisobda boʻlmagan buyumlar omborga kirim qilinganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 19921 “Ombordagi kam baholi va tez eskiruvchi buyumlar hamda boshqa qimmatliklar”;","Kt 45994 “Boshqa foizsiz daromadlar”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","46. Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarning haqqoniy qiymat oʻsishini aks ettirish uchun quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 10795 “Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlari haqqoniy qiymatining oʻzgarishi (aktiv-passiv)”;","Kt 45609 “Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarining haqqoniy qiymatining oʻzgarishi natijasida olingan foyda” yoki","Kt 45611 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlari haqqoniy qiymatining oʻzgarishi natijasida olingan foyda”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","47. Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarning haqqoniy qiymati pasayishini aks ettirish uchun quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 55610 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarning haqiqiy qiymatining oʻzgarishi natijasida koʻrilgan zararlar” yoki","Dt 55614 “Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlari haqiqiy qiymatining oʻzgarishi natijasida koʻrilgan zararlar”;","Kt 10795 “Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlari haqqoniy qiymatining oʻzgarishi (aktiv-passiv)”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","48. Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalarning haqqoniy qiymati oʻsishini aks ettirish uchun quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 10895 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar haqiqiy qiymatining oʻzgarishi (aktiv-passiv)”;","Kt 30907 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarning haqqoniy qiymatining oʻzgarishi natijasida hosil boʻlgan oʻzlashtirilmagan foyda yoki zararlar (aktiv-passiv)”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","49. Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalarning haqqoniy qiymati kamayishini aks ettirish uchun quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 30907 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarning haqqoniy qiymatining oʻzgarishi natijasida hosil boʻlgan oʻzlashtirilmagan foyda yoki zararlar (aktiv-passiv)”;","Kt 10895 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar haqiqiy qiymatining oʻzgarishi (aktiv-passiv)”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","50. Amortizatsiyalangan qiymati boʻyicha baholanadigan moliyaviy aktivlar va koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasini tashkil etish quyidagi buxgalteriya oʻtkazmasi bilan amalga oshiriladi:",["Dt 56826 “Koʻrilishi mumkin boʻlgan zararlarni baholash — Amortizatsiyalangan qiymati boʻyicha baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar”;","Kt 15999 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Amortizatsiyalangan qiymati boʻyicha baholanadigan qarz qimmatli qogʻozlarga qilingan investitsiyalar (kontr-aktiv)”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","51. Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan moliyaviy aktiv qadrsizlanganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["1) Haqqoniy qiymatni toʻgʻrilash summasini bekor qilish uchun:","Dt 10895 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar haqiqiy qiymatining oʻzgarishi (aktiv-passiv)”;","Kt 30907 “Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarning haqqoniy qiymatining oʻzgarishi natijasida hosil boʻlgan oʻzlashtirilmagan foyda yoki zararlar (aktiv-passiv)”;","2) Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasini tashkil etish uchun:","Dt 56808 “Koʻrilishi mumkin boʻlgan zararlarni baholash — Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar”;","Kt 10899 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar (kontr-aktiv)”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","52. Agar koʻrilishi mumkin boʻlgan zarar summasi ilgari kapitalda tan olingan haqiqiy qiymatning salbiy (manfiy) toʻgʻrilash summasidan oshib ketadigan boʻlsa, u holda banklar qoʻshimcha koʻrilishi mumkin boʻlgan zararlarni baholash summasini quyidagi buxgalteriya oʻtkazmasi orqali aks ettiradi:",["Dt 56808 “Koʻrilishi mumkin boʻlgan zararlarni baholash — Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar”;","Kt 10899 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Boshqa umumlashgan daromad orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlarga qilingan investitsiyalar (kontr-aktiv)”."]],["5-bob. Moliyaviy aktivlarning buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvla","53. Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar boʻyicha koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasini tashkil etishda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 56806 “Koʻrilishi mumkin boʻlgan zararlarni baholash — Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar”;","Kt 10799 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Foyda yoki zarar orqali haqqoniy qiymatda baholanadigan qimmatli qogʻozlar (kontr-aktiv)”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","54. Bank kassalariga naqd pullar kirim qilinganda, quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) bank mijozlari boʻlgan xoʻjalik yurituvchi subyektlar tomonidan naqd pullarni bevosita olib kelish yoʻli bilan hamda jismoniy shaxslar tomonidan omonatlarga naqd pullar topshirilganda:","Dt 10101 “Aylanma kassadagi naqd pullar” yoki","Dt 10111 “Amaliyot kassalaridagi naqd pullar”;","Kt Mijozlarning depozit hisobvaragʻi;","2) jismoniy shaxslar tomonidan bir martalik toʻlovlar (soliq toʻlovlari, jarimalar, kommunal va boshqa toʻlovlar) uchun naqd pullar topshirilganda:","Dt 10101 “Aylanma kassadagi naqd pullar” yoki","Dt 10111 “Amaliyot kassalaridagi naqd pullar”;","Kt 29824 “Naqd pul mablagʻlari boʻyicha jismoniy shaxslarning maqsadli hisob-kitoblari”;","3) jismoniy shaxslar tomonidan kreditni qaytarish uchun naqd pullar topshirilganda:","Dt 10101 “Aylanma kassadagi naqd pullar” yoki","Dt 10111 “Amaliyot kassalaridagi naqd pullar”;","Kt Mijozlarning tegishli kredit hisobvaragʻi yoki","Kt 12599 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Jismoniy shaxslarga berilgan qisqa muddatli kreditlar (kontr-aktiv)” va 14999 “Koʻrilishi mumkin boʻlgan zararlarni qoplash zaxirasi — Jismoniy shaxslarga berilgan uzoq muddatli kreditlar (kontr-aktiv)” (balansdan tashqari…","4) jismoniy shaxslar tomonidan olingan kreditlar boʻyicha foizlar toʻlovi uchun naqd pul topshirilganda:"]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","55. Bank kassasidan naqd pullar chiqim qilinganda, quyidagi buxgalteriya oʻtkazmasi orqali amalga oshiriladi:",["1) bank kassasidan mijozlarga ish haqi va unga tenglashtirilgan toʻlovlar, dividendlar, xizmat safari xarajatlari, nafaqa va moddiy yordam pullari, shuningdek qonunchilik hujjatlarida koʻzda tutilgan boshqa toʻlovlar boʻyicha naqd pul berilganda:","Dt Mijozlarning depozit va kredit hisobvaraqlari;","Kt 10101 “Aylanma kassadagi naqd pullar” yoki","Kt 10111 “Amaliyot kassalaridagi naqd pullar”;","2) bank kassasidan mazkur filialning mijozi boʻlgan jismoniy shaxsning bank kartalaridan naqd pul berilganda:","Dt 17401 “Jismoniy shaxslarning bank kartalaridan olingan naqd pullar boʻyicha hisobdan chiqarilishi lozim boʻlgan pul mablagʻlari boʻyicha tranzit hisobvaraqlar”;","Kt 10101 “Aylanma kassadagi naqd pullar” yoki","Kt 10111 “Amaliyot kassalaridagi naqd pullar”;","Dt 22618 “Jismoniy shaxslarning bank kartalari boʻyicha majburiyatlari” va 22617 “Pensionerlarning bank kartalari boʻyicha majburiyatlar”;","Kt 23504 “Bank kartalaridan berilgan naqd pullar yoki jismoniy shaxslarning depozit hisobvaraqlariga oʻtkazilgan mablagʻlar boʻyicha tranzit hisobvaraqlar”;","Dt 23504 “Bank kartalaridan berilgan naqd pullar yoki jismoniy shaxslarning depozit hisobvaraqlariga oʻtkazilgan mablagʻlar boʻyicha tranzit hisobvaraqlar”;","Kt 17401 “Jismoniy shaxslarning bank kartalaridan olingan naqd pullar boʻyicha hisobdan chiqarilishi lozim boʻlgan pul mablagʻlari boʻyicha tranzit hisobvaraqlar”;","3) bank kassasidan mazkur bankning boshqa filiali mijozi boʻlgan jismoniy shaxsning bank kartasidan naqd pul berilganda:","Naqd pul bergan bankning filialida:"]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","56. Bankning “eskirgan” toifadagi naqd pullari 10198 “Eskirgan” toifadagi naqd pullar” hisobvaragʻida yuritiladi va ushbu hisobvaraqqa “eskirgan” toifadagi naqd pullar 17301 “Tranzit hisobvaragʻi” orqali kirim (chiqim) qilinadi.",[]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","57. Inkassatorlar tomonidan mijozlardan yigʻib kelingan pul mablagʻlari boʻyicha inkassatsiya sumkasining (qopining) yuk xati asosida quyidagi buxgalteriya oʻtkazmalari amalga oshiriladi:",["1) inkassatorlar tomonidan yigʻib kelingan inkassatorlik qoplaridagi pul mablagʻlari shu bankning mijoziga tegishli boʻlsa:","Dt 19903 “Inkasso qilingan pul tushumlari va cheklar”;","Kt Mijozning depozit hisobvaragʻi;","2) inkassatorlar tomonidan yigʻib kelingan inkassatorlik qoplaridagi pul mablagʻlari boshqa bank yoki bankning boshqa filiali mijoziga tegishli boʻlsa:","Dt 19903 “Inkasso qilingan pul tushumlari va cheklar”;","Kt 29804 “Boshqa bank mijozlarining inkasso qilingan pul tushumlari va cheklari”;","3) inkassatorlar tomonidan yigʻib kelingan inkassatorlik qoplaridagi naqd pul boshqa hududda joylashgan bank (filiali)ning shu hududdagi bank binosidan tashqarida joylashgan amaliyot kassasiga tegishli boʻlsa:","Dt 19903 “Inkasso qilingan pul tushumlari va cheklar”;","Kt 29896 “Boshqa majburiyatlar”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","58. Qayta sanash kassasida inkassatorlik qoplaridagi pul mablagʻlari bankning aylanma kassasiga kirim qilinadi va quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 10101 “Aylanma kassadagi naqd pullar” yoki","Dt 10111 “Amaliyot kassalaridagi naqd pullar”;","Kt 19903 “Inkasso qilingan pul tushumlari va cheklar”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","59. Agar qayta sanash kassasida ortiqcha naqd pul mablagʻlari aniqlansa, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 10101 “Aylanma kassadagi naqd pullar” yoki","Dt 10111 “Amaliyot kassalaridagi naqd pullar”;","Kt 29816 “Naqd pullarni qayta hisoblashda aniqlangan ortiqchalar”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","60. Bankning qayta sanash kassasida aniqlangan ortiqcha naqd pul mablagʻlari ushbu bankning mijoziga tegishli boʻlsa, u mijozning hisobvaragʻiga quyidagi buxgalteriya oʻtkazmasi orqali kirim qilinadi:",["Dt 29816 “Naqd pullarni qayta hisoblashda aniqlangan ortiqchalar”;","Kt Mijozning depozit hisobvaragʻi."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","61. Bankning qayta sanash kassasida aniqlangan ortiqcha naqd pul mablagʻlari boshqa bank mijozining 29804 “Boshqa bank mijozlarining inkasso qilingan pul tushumlari va cheklari” hisobvaragʻiga shartnomada kelishilgan hollarda oʻtkazib berilganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 29816 “Naqd pullarni qayta hisoblashda aniqlangan ortiqchalar”;","Kt 29804 “Boshqa bank mijozlarining inkasso qilingan pul tushumlari va cheklari”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","62. Agar bankning qayta sanash kassasida aniqlangan ortiqcha naqd pul mablagʻlari shu hududda bosh banki yoki filiali boʻlmagan bank binosidan tashqarida joylashgan amaliyot kassasiga tegishli boʻlsa, unda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 29816 “Naqd pullarni qayta hisoblashda aniqlangan ortiqchalar”;","Kt 29896 “Boshqa majburiyatlar”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","63. Bankning qayta sanash kassasida aniqlangan kamomad summasi ushbu bankning mijoziga tegishli boʻlsa va u mijozning hisobvaragʻidan undirib olinganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt Mijozning depozit hisobvaragʻi;","Kt 19935 “Naqd pullarni qayta hisoblashda aniqlangan kamomad”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","64. Bankning qayta sanash kassasida aniqlangan kamomad summasi boshqa bank mijozining 29804 — “Boshqa bank mijozlarining inkasso qilingan pul tushumlari va cheklari” balans hisobvaragʻidan shartnomada kelishilgan shartlarga asosan undirib olinganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 29804 “Boshqa bank mijozlarining inkasso qilingan pul tushumlari va cheklari”;","Kt 19935 “Naqd pullarni qayta hisoblashda aniqlangan kamomad”.","Agar bankning qayta sanash kassasida aniqlangan kamomad summasi shu hududda bosh banki yoki filiali boʻlmagan bank binosidan tashqarida joylashgan amaliyot kassasiga tegishli boʻlsa va u shartnomada kelishilgan shartlarga binoan undirib olinganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 29896 “Boshqa majburiyatlar”;","Kt 19935 “Naqd pullarni qayta hisoblashda aniqlangan kamomad”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","65. Boshqa bankning mijozlariga tegishli boʻlgan naqd pul mablagʻlari boʻyicha quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 29804 “Boshqa bank mijozlarining inkasso qilingan pul tushumlari va cheklari”;","Kt Mijozning depozit hisobvaragʻi (16103 “Bosh ofis/filiallardan filiallar va banklararo hisob-kitoblar boʻyicha olinadigan mablagʻlar”).","Bosh banki yoki filiali boʻlmagan bank binosidan tashqarida joylashgan amaliyot kassasiga tegishli boʻlgan naqd pul mablagʻlari boʻyicha buxgalteriya oʻtkazmasi amalga oshiriladi:","Dt 29896 “Boshqa majburiyatlar” — naqd pulni qabul qilgan tijorat banki (filiali);","Kt 29896 “Boshqa majburiyatlar” — boshqa hududda joylashgan bank (filiali)."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","66. Mablagʻ oluvchining bankiga elektron toʻlov tizimi orqali mablagʻ kelib tushganda, quyidagi buxgalteriya oʻtkazmasi orqali kirim qilinadi:",["Dt 29804 “Boshqa bank mijozlarining inkasso qilingan pul tushumlari va cheklari” (16103 “Bosh ofis/filiallardan filiallar va banklararo hisob-kitoblar boʻyicha olinadigan mablagʻlar” hisobvaragʻi orqali);","Kt Mijozning depozit hisobvaragʻi”.","Bos lteriya yozuvlari","69. Markaziy bankning hududiy bosh boshqarmalari Hisob-kitob kassa markazlariga (bundan buyon matnda HKKM deb yuritiladi) madad puli olish uchun mablagʻ kelib tushganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 10307 “Markaziy bankdan olinishi lozim boʻlgan mablagʻlar — Naqd pullar” (Markaziy bankning 16103 “Bosh ofis/filiallardan filiallar va banklararo hisob-kitoblar boʻyicha olinadigan mablagʻlar” hisobvaragʻi orqali);","Kt 21307 “Naqd pul olish uchun rezident banklardan kelib tushgan mablagʻlar”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","70. Markaziy bankning hududiy bosh boshqarmalari HKKMlari tomonidan madad puli joʻnatilganda quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 10109 “Yoʻldagi naqd pullar va boshqa toʻlov hujjatlari”;","Kt 10101 “Aylanma kassadagi naqd pullar” yoki","Kt 10111 “Amaliyot kassalaridagi naqd pullar”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","71. Filiali mavjud boʻlmagan tashabbuskor bankka HKKMdan Markaziy bank hududiy bosh boshqarmalari farmoyishiga asosan madad puli keltirilganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 10101 “Aylanma kassadagi naqd pullar” yoki","Dt 10111 “Amaliyot kassalaridagi naqd pullar”;","Kt 10307 “Markaziy bankdan olinishi lozim boʻlgan mablagʻlar — Naqd pullar”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","72. Markaziy bankning hududiy bosh boshqarmalari HKKMlariga filiali mavjud boʻlmagan tashabbuskor bankdan madad pulini olganligi toʻgʻrisida tasdiqnoma kelganda, quyidagi buxgalteriya oʻtkazmasi amalga oshiriladi:",["Dt 21307 “Naqd pul olish uchun rezident banklardan kelib tushgan mablagʻlar”;","Kt 10109 “Yoʻldagi naqd pullar va boshqa toʻlov hujjatlari”."]],["6-bob. Kassa amallarining buxgalteriya hisobini yuritish boʻyicha buxgalteriya yozuvlari","73. Tashabbuskor bank filialida (fil
